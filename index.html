<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUTAD | Building Materials Accounting</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 38 38'%3E%3Crect width='38' height='38' rx='9' fill='%23B5502E'/%3E%3Ctext x='19' y='26' font-family='Arial' font-size='19' font-weight='bold' fill='white' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B1F27;
  --ink-2:#252B36;
  --ink-3:#323A48;
  --paper:#F6F3EC;
  --paper-2:#FFFFFF;
  --line:#E4DFD1;
  --line-strong:#D8D2C0;
  --clay:#B5502E;
  --clay-dark:#8F3E22;
  --clay-light:#F1DDD3;
  --steel:#35597A;
  --steel-light:#DCE6EE;
  --good:#3F7D58;
  --good-light:#DFEEE4;
  --bad:#B33F3F;
  --bad-light:#F6DEDE;
  --amber:#B8860B;
  --amber-light:#F3E7C9;
  --text:#211E1A;
  --text-soft:#5B564C;
  --text-faint:#8B8577;
  --radius:10px;
  --shadow: 0 1px 2px rgba(27,31,39,.06), 0 6px 20px rgba(27,31,39,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--paper);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
::selection{ background:var(--clay-light); color:var(--clay-dark); }
h1,h2,h3,.display{ font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; letter-spacing:-0.01em; }
h3{ font-size:15px; font-weight:700; }
h4{ font-size:13.5px; font-weight:700; }
h5{ font-size:13px; font-weight:700; }
.num, .mono{ font-family:'JetBrains Mono',monospace,'Courier New',monospace; font-variant-numeric:tabular-nums; }
button{ font-family:inherit; cursor:pointer; }
input,select,textarea{ font-family:inherit; }
a{ color:inherit; }

.app{ display:flex; min-height:100vh; }

.sidebar{
  width:248px; flex:0 0 248px;
  background:var(--ink);
  color:#EDEAE2;
  display:flex; flex-direction:column;
  position:fixed; top:0; bottom:0; left:0;
  z-index:40;
  transition: transform .25s ease;
}
.brand{
  padding:22px 20px 18px;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.brand .mark{
  width:38px;height:38px;border-radius:9px;
  background:linear-gradient(155deg, var(--clay), var(--clay-dark));
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px; color:#fff;
  margin-bottom:12px;
  box-shadow: 0 3px 10px rgba(181,80,46,.35);
}
.brand h1{ font-size:16.5px; font-weight:700; margin:0 0 2px; color:#fff; letter-spacing:-0.01em;}
.brand p{ font-size:11.5px; color:#9A9484; margin:0; letter-spacing:.04em; text-transform:uppercase;}

.nav{ flex:1; padding:14px 10px; overflow-y:auto; }
.nav-group-label{
  font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:#726C5D;
  padding:14px 12px 6px;
}
.nav-item{
  display:flex; align-items:center; gap:11px;
  padding:9px 12px; margin:1px 0;
  border-radius:8px; color:#C7C2B4; font-size:13.6px; font-weight:500;
  cursor:pointer; user-select:none;
  border:1px solid transparent;
  transition: background .12s ease, color .12s ease;
}
.nav-item:hover{ background:rgba(255,255,255,.05); color:#fff; }
.nav-item.active{
  background:rgba(181,80,46,.16); color:#F3D9CC; border-color:rgba(181,80,46,.35);
}
.nav-item .ic{ width:17px; height:17px; flex:0 0 17px; opacity:.9; }
.nav-item .badge{
  margin-left:auto; font-size:10.5px; font-family:'JetBrains Mono',monospace;
  background:rgba(255,255,255,.08); padding:1px 6px; border-radius:20px; color:#B7B2A4;
}
.nav-item.active .badge{ background:rgba(181,80,46,.3); color:#F3D9CC; }

.sidebar-foot{
  padding:14px 18px 18px; border-top:1px solid rgba(255,255,255,.08);
  font-size:11px; color:#726C5D; line-height:1.5;
}
.sidebar-foot b{ color:#B7B2A4; }
.storage-dot{ width:7px;height:7px;border-radius:50%; background:var(--good); display:inline-block; margin-right:6px; }

.main{ margin-left:248px; flex:1; min-width:0; display:flex; flex-direction:column; min-height:100vh; }
.topbar{
  position:sticky; top:0; z-index:30;
  background:rgba(246,243,236,.86); backdrop-filter: blur(8px);
  border-bottom:1px solid var(--line);
  padding:16px 30px; display:flex; align-items:center; justify-content:space-between; gap:16px;
  flex-wrap:wrap;
}
.topbar h2{ font-size:20px; margin:0; font-weight:700; }
.topbar .sub{ font-size:12.5px; color:var(--text-soft); margin-top:2px; font-weight:500;}
.topbar-actions{ display:flex; gap:10px; align-items:center; }
.menu-toggle{ display:none; }

.view{ display:none; padding:26px 30px 60px; max-width:1400px; }
.view.active{ display:block; animation: fadein .25s ease; }
@keyframes fadein{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

.btn{
  display:inline-flex; align-items:center; gap:7px;
  padding:9px 15px; border-radius:8px; border:1px solid var(--line-strong);
  background:#fff; color:var(--text); font-size:13.2px; font-weight:600;
  transition: all .12s ease;
}
.btn:hover{ border-color:var(--text-faint); }
.btn-primary{ background:var(--clay); color:#fff; border-color:var(--clay); }
.btn-primary:hover{ background:var(--clay-dark); border-color:var(--clay-dark); }
.btn-ghost{ background:transparent; border-color:transparent; }
.btn-ghost:hover{ background:var(--line); }
.btn-sm{ padding:6px 11px; font-size:12.3px; border-radius:7px;}
.btn-danger{ color:var(--bad); }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.icon-btn{
  width:32px;height:32px; border-radius:7px; display:inline-flex; align-items:center; justify-content:center;
  border:1px solid var(--line-strong); background:#fff;
  transition: background .12s ease;
}
.icon-btn:hover{ background:var(--line); }
.icon-btn svg{ width:15px;height:15px; }

.grid{ display:grid; gap:16px; }
.grid-4{ grid-template-columns:repeat(4,1fr); }
.grid-2{ grid-template-columns:repeat(2,1fr); }
.grid-3{ grid-template-columns:repeat(3,1fr); }
@media(max-width:1100px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);} }

.card{
  background:var(--paper-2); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px 20px; box-shadow:var(--shadow);
  transition: box-shadow .15s ease, transform .15s ease;
}
.card.clickable{ cursor:pointer; }
.card.clickable:hover{ box-shadow:0 2px 4px rgba(27,31,39,.08), 0 10px 28px rgba(27,31,39,.1); transform:translateY(-1px); }
.kpi .kpi-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); font-weight:600; margin-bottom:8px; }
.kpi .kpi-value{ font-size:26px; font-weight:700; font-family:'Space Grotesk',sans-serif; letter-spacing:-0.01em;}
.kpi .kpi-sub{ font-size:12px; color:var(--text-soft); margin-top:5px; }
.kpi.good .kpi-value{ color:var(--good); }
.kpi.bad .kpi-value{ color:var(--bad); }
.kpi.accent .kpi-value{ color:var(--clay); }
.kpi.steel .kpi-value{ color:var(--steel); }

.section-title{ display:flex; align-items:center; justify-content:space-between; margin:28px 0 14px; }
.section-title h3{ font-size:15px; margin:0; font-weight:700; }
.section-title .hint{ font-size:12px; color:var(--text-faint); }

.table-wrap{
  background:var(--paper-2); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
  box-shadow:var(--shadow);
}
table{ width:100%; border-collapse:collapse; font-size:13px; }
thead th{
  text-align:left; font-size:10.8px; text-transform:uppercase; letter-spacing:.05em;
  color:var(--text-faint); font-weight:700; padding:11px 14px; background:#FBFAF6;
  border-bottom:1px solid var(--line); white-space:nowrap;
}
tbody td{ padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:middle; color:var(--text); }
tbody tr:last-child td{ border-bottom:none; }
tbody tr:hover{ background:#FBF9F4; }
.num-cell{ font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums; text-align:right; }
.center-cell{ text-align:center; }
.row-clickable{ cursor:pointer; }
.table-empty{ padding:50px 20px; text-align:center; color:var(--text-faint); font-size:13.5px; }

.badge{
  display:inline-flex; align-items:center; gap:5px;
  padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; letter-spacing:.02em;
  text-transform:uppercase;
}
.badge-good{ background:var(--good-light); color:var(--good); }
.badge-bad{ background:var(--bad-light); color:var(--bad); }
.badge-amber{ background:var(--amber-light); color:var(--amber); }
.badge-steel{ background:var(--steel-light); color:var(--steel); }
.badge-neutral{ background:#EFEBE0; color:var(--text-soft); }

.stamp{
  display:inline-block; padding:3px 10px; border-radius:4px; font-size:10.5px; font-weight:700;
  letter-spacing:.06em; text-transform:uppercase; border:1.5px solid currentColor; transform:rotate(-2deg);
}
.stamp-paid{ color:var(--good); }
.stamp-part{ color:var(--amber); }
.stamp-unpaid{ color:var(--bad); }

.modal-overlay{
  position:fixed; inset:0; background:rgba(27,31,39,.5); backdrop-filter:blur(2px);
  display:none; align-items:flex-start; justify-content:center; z-index:100; padding:5vh 20px;
  overflow-y:auto;
}
.modal-overlay.active{ display:flex; }
.modal{
  background:var(--paper-2); border-radius:14px; width:100%; max-width:750px;
  box-shadow:0 20px 60px rgba(0,0,0,.25); animation:modalIn .18s ease;
  margin-bottom: 5vh;
}
@keyframes modalIn{ from{opacity:0; transform:translateY(10px) scale(.98);} to{opacity:1; transform:none;} }
.modal-head{ padding:18px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between;}
.modal-head h3{ margin:0; font-size:16px; }
.modal-body{ padding:20px 22px; max-height:65vh; overflow-y:auto; }
.modal-foot{ padding:16px 22px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px; }

.field{ margin-bottom:14px; }
.field label{ display:block; font-size:12px; font-weight:600; color:var(--text-soft); margin-bottom:6px; }
.field .req{ color:var(--clay); }
.field input, .field select, .field textarea{
  width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--line-strong);
  font-size:13.5px; background:#fff; color:var(--text);
}
.field input:focus, .field select:focus, .field textarea:focus{
  outline:none; border-color:var(--clay); box-shadow:0 0 0 3px var(--clay-light);
}
.field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.field-hint{ font-size:11.5px; color:var(--text-faint); margin-top:5px; }
.field-note{ font-size:11px; color:var(--text-faint); font-style:italic; margin-top:2px; }
fieldset{ border:1px dashed var(--line-strong); border-radius:8px; padding:12px 14px 2px; margin:16px 0 10px; }
fieldset legend{ font-size:11.5px; font-weight:700; color:var(--text-soft); padding:0 6px; text-transform:uppercase; letter-spacing:.04em;}

.toolbar{ display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
.search-box{ position:relative; flex:1; min-width:200px; max-width:320px; }
.search-box input{ width:100%; padding:8px 12px 8px 32px; border-radius:8px; border:1px solid var(--line-strong); font-size:13px; background:#fff;}
.search-box svg{ position:absolute; left:10px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--text-faint); }
.tabs{ display:flex; gap:4px; background:#EFEBE0; padding:3px; border-radius:9px; }
.tab-btn{ padding:6px 13px; border-radius:7px; font-size:12.5px; font-weight:600; color:var(--text-soft); background:transparent; border:none; transition: all .12s ease;}
.tab-btn.active{ background:#fff; color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.08); }
.spacer{ flex:1; }
select.filter-select{ padding:8px 12px; border-radius:8px; border:1px solid var(--line-strong); font-size:12.8px; background:#fff; }
input.filter-select{ padding:8px 12px; border-radius:8px; border:1px solid var(--line-strong); font-size:12.8px; background:#fff; }

.note-banner{
  background:var(--steel-light); border:1px solid #C4D6E4; color:#28425A;
  border-radius:10px; padding:13px 16px; font-size:12.8px; line-height:1.55; margin-bottom:18px;
  display:flex; gap:10px;
}
.note-banner svg{ flex:0 0 16px; margin-top:2px; }
.pill-list{ display:flex; flex-wrap:wrap; gap:6px; }
.wallet-chip{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px; }
.wallet-chip.pos{ color:var(--good); }
.wallet-chip.neg{ color:var(--bad); }
.progress-track{ height:7px; border-radius:5px; background:#EFEBE0; overflow:hidden; margin-top:8px;}
.progress-fill{ height:100%; background:linear-gradient(90deg, var(--clay), var(--clay-dark)); border-radius:5px; transition: width .3s ease; }
.divider{ height:1px; background:var(--line); margin:18px 0; }
.two-col{ display:grid; grid-template-columns:1.3fr 1fr; gap:18px; }
@media(max-width:980px){ .two-col{grid-template-columns:1fr;} }
.chart-card{ padding:18px 20px 10px; }
.chart-card h4{ margin:0 0 4px; font-size:13.5px; }
.chart-card .hint{ font-size:11.5px; color:var(--text-faint); margin-bottom:10px; }
.chart-box{ position:relative; height:230px; }
.chart-box.tall{ height:290px; }

.activity-item{ display:flex; gap:11px; padding:10px 0; border-bottom:1px solid var(--line); }
.activity-item:last-child{ border-bottom:none; }
.activity-dot{ width:8px;height:8px; border-radius:50%; margin-top:5px; flex:0 0 8px; }
.activity-item b{ font-weight:600; }
.activity-item .meta{ font-size:11.5px; color:var(--text-faint); margin-top:2px; }
.activity-amt{ margin-left:auto; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px; white-space:nowrap; }

.drawer-overlay{ position:fixed; inset:0; background:rgba(27,31,39,.45); z-index:90; display:none; }
.drawer-overlay.active{ display:block; }
.drawer{
  position:fixed; top:0; right:0; bottom:0; width:420px; max-width:92vw; background:var(--paper-2);
  z-index:95; box-shadow:-10px 0 40px rgba(0,0,0,.2); transform:translateX(100%); transition:transform .22s ease;
  overflow-y:auto;
}
.drawer.active{ transform:translateX(0); }
.drawer-head{ padding:20px 22px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--paper-2); z-index:2;}
.drawer-body{ padding:20px 22px; }

.empty-state{ text-align:center; padding:60px 20px; color:var(--text-faint); }
.empty-state svg{ width:40px; height:40px; margin-bottom:12px; opacity:.5; }
.empty-state p{ font-size:13.5px; margin:4px 0; }

.toast-wrap{ position:fixed; bottom:22px; right:22px; z-index:200; display:flex; flex-direction:column; gap:8px; }
.toast{
  background:var(--ink); color:#fff; padding:11px 16px; border-radius:9px; font-size:13px; font-weight:500;
  box-shadow:0 8px 24px rgba(0,0,0,.25); display:flex; align-items:center; gap:8px; animation:toastIn .2s ease;
}
.toast.err{ background:var(--bad); }
.toast.ok{ background:var(--good); }
@keyframes toastIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

.dropdown-menu{
  position:fixed; z-index:150; min-width:190px; background:#fff; border:1px solid var(--line-strong);
  border-radius:9px; box-shadow:0 10px 30px rgba(27,31,39,.18); padding:6px; animation:modalIn .12s ease;
}
.dropdown-item{
  display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:6px; font-size:13px; font-weight:500;
  cursor:pointer; color:var(--text); white-space:nowrap;
}
.dropdown-item:hover{ background:var(--line); }
.dropdown-item.danger{ color:var(--bad); }
.dropdown-item svg{ width:15px; height:15px; flex:0 0 15px; opacity:.8; }
.dropdown-item.disabled{ opacity:.4; cursor:not-allowed; pointer-events:none; }
.dropdown-sep{ height:1px; background:var(--line); margin:5px 2px; }

@media(max-width:880px){
  .sidebar{ transform:translateX(-100%); }
  .sidebar.open{ transform:translateX(0); }
  .main{ margin-left:0; }
  .menu-toggle{ display:inline-flex; }
  .grid-4, .grid-3, .grid-2{ grid-template-columns:1fr; }
  .field-row{ grid-template-columns:1fr; }
  .view{ padding:20px 16px 50px; }
  .topbar{ padding:14px 16px; }
}

@media print{
  body *{ visibility:hidden; }
  #invoicePrintArea, #invoicePrintArea *, #reportPrintArea, #reportPrintArea *{ visibility:visible; }
  #invoicePrintArea{ position:absolute; top:0; left:0; width:100%; padding:0; }
  #reportPrintArea{ position:absolute; top:0; left:0; width:100%; padding:20px; }
  .modal-overlay, .modal{ position:static; box-shadow:none; background:none; max-width:none; }
  .no-print{ display:none !important; }
  .sidebar, .topbar, .toolbar{ display:none !important; }
}

.global-search-wrapper{
  position:relative;
}
.global-search-wrapper input{
  width:300px; padding:8px 14px 8px 36px; border-radius:8px; border:1px solid var(--line-strong);
  font-size:13px; background:#fff; transition:width .2s;
}
.global-search-wrapper input:focus{
  width:400px; outline:none; border-color:var(--clay); box-shadow:0 0 0 3px var(--clay-light);
}
.global-search-wrapper .search-icon{
  position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-faint);
  width:14px; height:14px;
}
.global-search-wrapper .search-icon svg{ width:14px; height:14px; display:block; }
.global-search-results{
  position:absolute; top:calc(100% + 4px); left:0; right:0;
  background:#fff; border:1px solid var(--line-strong); border-radius:8px;
  box-shadow:0 8px 24px rgba(0,0,0,.15); max-height:400px; overflow-y:auto;
  display:none; z-index:50;
}
.global-search-results.active{ display:block; }
.gs-item{
  padding:10px 14px; border-bottom:1px solid var(--line); cursor:pointer; display:flex; gap:10px; align-items:center;
}
.gs-item:hover{ background:var(--line); }
.gs-item .gs-icon{ font-size:16px; opacity:.6; width:18px; text-align:center; }
.gs-item .gs-icon svg{ width:16px; height:16px; }
.gs-item .gs-main{ flex:1; }
.gs-item .gs-title{ font-weight:600; font-size:13px; }
.gs-item .gs-sub{ font-size:11.5px; color:var(--text-faint); }
.gs-item .gs-tag{ font-size:10px; padding:2px 8px; border-radius:12px; background:var(--steel-light); color:var(--steel); text-transform:uppercase; font-weight:700; letter-spacing:.03em; }

.model-tag{
  display:inline-block; padding:2px 8px; border-radius:4px; font-size:10px; font-weight:600;
}
.model-tag.ds{ background:#DCE6EE; color:#35597A; }
.model-tag.th-trip{ background:#F1DDD3; color:#B5502E; }
.model-tag.tr-trip{ background:#DFEEE4; color:#3F7D58; }
.model-tag.tr-day{ background:#E8D5B7; color:#8B6914; }
.model-tag.th-day{ background:#D4C5A9; color:#6B5B3E; }
.model-tag.contract{ background:#C9C0BB; color:#4A403B; }
.model-tag.partner{ background:#C5D4D9; color:#2C5F6E; }

.hidden-fields-wrapper{ margin:10px 0; }
.hidden-fields-toggle{
  background:var(--steel-light); border:1px solid var(--line-strong); border-radius:6px;
  padding:8px 14px; font-size:12.5px; font-weight:600; color:var(--steel);
  cursor:pointer; display:inline-flex; align-items:center; gap:6px;
}
.hidden-fields-toggle:hover{ background:#C4D6E4; }
.hidden-fields-content{ display:none; margin-top:10px; padding:12px; border:1px dashed var(--line-strong); border-radius:6px; background:#FBFAF6; }
.hidden-fields-content.open{ display:block; }

.supplier-balance{ font-size:12px; color:var(--text-soft); }
.supplier-balance .amount{ font-weight:700; }
.supplier-balance.positive .amount{ color:var(--good); }
.supplier-balance.negative .amount{ color:var(--bad); }

.trip-entry{ border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:10px; }
.trip-entry .trip-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.trip-entry .trip-header h5{ margin:0; }
</style>
</head>
<body>
<div id="app" class="app"></div>

      const def = defaultPrices[m] || {};

        id: 'prod_' + (DB.counters.prod++),
        name: m,
        sellingPrice: def.sellingPrice || 0,
        unit: '', notes: '', active: true,
        materialCost: def.materialCost || 0,

        fuelPerTrip: def.fuelPerTrip || 0,

    }
  });
  DB.products = existingProducts;
}

// 4. BUSINESS LOGIC
// ============================================================
function normName(s){ return (s||'').toString().trim().toUpperCase(); }
function titleCase(s){ if (!s) return ''; return s.toString().trim().toLowerCase().replace(/\b\w/g, c=>c.toUpperCase()); }
function fmtMoney(n){ n = Number(n)||0; const neg = n < 0; const v = Math.round(Math.abs(n)).toLocaleString('en-NG'); return (neg?'-':'') + '₦' + v; }
function fmtNum(n){ return Math.round(Number(n)||0).toLocaleString('en-NG'); }
function fmtDate(d){ if(!d) return '—'; const dt = new Date(d+'T00:00:00'); if(isNaN(dt)) return d; return dt.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'}); }
function todayISO(){ return new Date().toISOString().slice(0,10); }

function calculateRevenue(op) {
  const model = op.invoiceType || 'DS';
  const cat = getModelCategory(model);
  if (cat === 'material') {
    return (Number(op.qty) || 0) * (Number(op.unitPrice) || 0);
  }
  else if (cat === 'partner') {
    return Number(op.jobRevenue) || 0;
  }
  else if (cat === 'rental') {
    return Number(op.rentalCharges) || 0;
  }
  else if (cat === 'hire') {
    return Number(op.transportFee) || 0;
  }
  else if (cat === 'commission') {
    return Number(op.commissionAmount) || 0;
  }
  return 0;
}

// Sum of whatever the user has entered in the optional [+] hidden cost fields for this model.
// rentalCharges is excluded everywhere — it's revenue, not a cost.
function extraHireCosts(op) {
  if (!op) return 0;
  const fields = getModelFields(op.invoiceType || 'DS');
  return (fields.hidden || []).reduce((s, f) => f === 'rentalCharges' ? s : s + (Number(op[f]) || 0), 0);
}

function calculateCosts(op) {
  if (!op) return 0;
  const model = op.invoiceType || 'DS';
  const fields = getModelFields(model);
  let total = 0;
  fields.always.forEach(f => {
    if (f === 'rentalCharges') return; // revenue, not a cost
    total += Number(op[f]) || 0;
  });
  total += extraHireCosts(op);
  if (model === 'PARTNER') {
    total += Number(op.partnerCost) || 0;
  }
  return total;
}

function calculateProfit(op) {
  return calculateRevenue(op) - calculateCosts(op);
}

function opRevenue(op){ return op.orderStatus === 'EXECUTED' ? calculateRevenue(op) : 0; }
function opNetProfit(op){ return op.orderStatus === 'EXECUTED' ? calculateProfit(op) : 0; }

function byDateThenId(a,b){
  const da = a.date||'', db = b.date||'';
  if(da !== db) return da < db ? -1 : 1;
  return (a.jobId||a.id||'').localeCompare(b.jobId||b.id||'');
}

function totalDepositsFor(customerName){
  const key = normName(customerName);
  return (DB.payments || []).filter(p=>normName(p.customer)===key).reduce((s,p)=>s+(Number(p.amount)||0),0);
}

function invoiceStatusOf(op){
  if (op.orderStatus === 'PENDING') return 'Draft';
  if (op.orderStatus === 'CANCELLED') return 'Cancelled';
  const row = computeSalesLedger().find(r => r.id === op.id);
  return row ? row.status : 'UnPaid';
}
function invoiceStatusBadgeClass(status){
  return { Paid:'badge-good', 'Part Paid':'badge-amber', UnPaid:'badge-bad', Draft:'badge-neutral', Cancelled:'badge-bad' }[status] || 'badge-neutral';
}

function computeSalesLedger(){
  const executed = (DB.operations || []).filter(o=>o.orderStatus==='EXECUTED').slice().sort(byDateThenId);
  const consumed = {};
  return executed.map(op=>{
    const due = calculateRevenue(op);
    const key = normName(op.customer);
    const priorDue = consumed[key] || 0;
    const deposits = totalDepositsFor(op.customer);
    const paid = Math.max(0, Math.min(due, deposits - priorDue));
    consumed[key] = priorDue + due;
    const balance = due - paid;
    let status = 'UnPaid';
    if(balance <= 0.5) status = 'Paid';
    else if(paid > 0) status = 'Part Paid';
    const custPays = (DB.payments || []).filter(p=>normName(p.customer)===key).sort(byDateThenId);
    const lastPaymentDate = custPays.length ? custPays[custPays.length-1].date : null;
    return { ...op, amountDue: due, amountPaid: paid, balance, status, lastPaymentDate };
  });
}

function computeCustomerWallets(){
  const salesRows = computeSalesLedger();
  const nameMap = new Map();
  const register = (n)=>{ if(!n) return; const key = normName(n); if(!nameMap.has(key)) nameMap.set(key, titleCase(n)); };
  (DB.customers || []).forEach(c=>register(c.name));
  (DB.operations || []).forEach(o=>register(o.customer));
  (DB.payments || []).forEach(p=>register(p.customer));

  const rows = [];
  for(const [key, display] of nameMap){
    const deposits = (DB.payments || []).filter(p=>normName(p.customer)===key).reduce((s,p)=>s+(Number(p.amount)||0),0);
    const delivered = salesRows.filter(r=>normName(r.customer)===key).reduce((s,r)=>s+r.amountDue,0);
    const jobs = salesRows.filter(r=>normName(r.customer)===key).length;
    const record = (DB.customers || []).find(c=>normName(c.name)===key);
    rows.push({ key, name: display, deposits, delivered, balance: deposits - delivered, jobs, record });
  }
  return rows.sort((a,b)=>a.name.localeCompare(b.name));
}

function getCustomerSummary(name){
  if(!name) return null;
  const key = normName(name);
  const wallets = computeCustomerWallets();
  const w = wallets.find(r=>r.key===key);
  const allSales = computeSalesLedger().filter(r=>normName(r.customer)===key);
  const totalSupplied = allSales.reduce((s,r)=>s+r.amountDue,0);
  const totalPaid = allSales.reduce((s,r)=>s+r.amountPaid,0);
  const lastTransaction = allSales.length ? allSales[allSales.length-1].date :
                         (DB.payments || []).filter(p=>normName(p.customer)===key).sort(byDateThenId).pop()?.date || null;
  return {
    name: w?.name || titleCase(name),
    deposits: w?.deposits || 0,
    delivered: w?.delivered || 0,
    balance: w?.balance || 0,
    jobs: w?.jobs || 0,
    totalSupplied,
    totalPaid,
    lastTransaction,
    record: w?.record || null
  };
}

function getSupplierBalance(supplierId){
  const supplier = DB.suppliers.find(s => s.id === supplierId);
  return supplier ? supplier.balance : 0;
}

function updateSupplierBalance(supplierId, amount){
  const supplier = DB.suppliers.find(s => s.id === supplierId);
  if(supplier) {
    supplier.balance = (supplier.balance || 0) + amount;
    supplier.totalHiringCost = (supplier.totalHiringCost || 0) + (amount > 0 ? amount : 0);
    saveDB();
  }
}

// ---- Creditor accounting (double-entry aware) --------------------------------
// What we have paid a partner, straight from the Cash & Bank ledger.
function partnerPaymentTotal(partnerId){
  return (DB.payments || []).filter(p => p.partnerId === partnerId)
    .reduce((s,p) => s + Math.abs(Number(p.amount) || 0), 0);
}
// What we have paid a collaborator, straight from the Cash & Bank ledger.
function supplierPaymentTotal(supplierId){
  return (DB.payments || []).filter(p => p.supplierId === supplierId)
    .reduce((s,p) => s + Math.abs(Number(p.amount) || 0), 0);
}

// Recomputed from scratch (never patched) so collaborator payouts and payments
// can never cause partner totals to drift or double-count. Amounts charged sit
// as an unpaid Account Payable until a payment is recorded against the partner.
function recomputeAllPartnerTotals(){
  (DB.partners || []).forEach(p => {
    p.totalJobs = 0;
    p.totalCharged = 0;
    p.totalPaid = partnerPaymentTotal(p.id);
  });
  (DB.jobs || []).filter(j => j.jobType === 'PARTNER').forEach(job => {
    const seen = new Set();
    (job.collaboratorPayouts || []).forEach(payout => {
      const rec = getPartnerByName(payout.partnerName);
      if (!rec) return;
      rec.totalCharged = (rec.totalCharged || 0) + (Number(payout.amount) || 0);
      if (!seen.has(rec.id)) { rec.totalJobs = (rec.totalJobs || 0) + 1; seen.add(rec.id); }
    });
  });
  (DB.partners || []).forEach(p => {
    p.balance = (p.totalCharged || 0) - (p.totalPaid || 0);
  });
}

// A collaborator's payable is recomputed from every TH-DAY job that names them
// plus any standalone hired-truck invoices — so edits never leave it out of sync.
function recomputeSupplierBalance(supplierName){
  const supplier = getSupplierByName(supplierName);
  if (!supplier) return;
  let owed = 0;
  (DB.jobs || []).forEach(j => {
    if (j.jobType === 'TH-DAY' && normName(j.collaborator) === normName(supplierName)) {
      owed += Number(j.dailyHireCost) || 0;
    }
  });
  (DB.operations || []).forEach(o => {
    if (o.orderStatus !== 'EXECUTED') return;
    if (o.parentJobId) return; // job children are counted via their job's dailyHireCost
    if (!['TH-TRIP','TH-DAY'].includes(o.invoiceType)) return;
    if (normName(o.supplier) !== normName(supplierName)) return;
    owed += Number(o.hiringCost) || 0;
  });
  const paid = supplierPaymentTotal(supplier.id);
  supplier.totalHiringCost = owed;
  supplier.totalPaid = paid;
  supplier.balance = owed - paid;
}
function recomputeAllSupplierBalances(){
  (DB.suppliers || []).forEach(s => recomputeSupplierBalance(s.name));
}

// Applies each partner's recorded payments to their payout lines, oldest first —
// the same wallet-consumption rule the sales ledger uses for customers. Each
// payout ends up Paid / Part Paid / UnPaid exactly like an invoice.
function computePartnerPayoutLedger(){
  const rows = [];
  (DB.jobs || []).filter(j => j.jobType === 'PARTNER').forEach(job => {
    (job.collaboratorPayouts || []).forEach((p, i) => {
      rows.push({
        key: normName(p.partnerName),
        partnerName: p.partnerName,
        amount: Number(p.amount) || 0,
        notes: p.notes || '',
        jobDate: job.date,
        jobId: job.jobId,
        jobContainerId: job.id,
        payoutIdx: i,
      });
    });
  });
  rows.sort((a,b) => a.jobDate < b.jobDate ? -1 : a.jobDate > b.jobDate ? 1 : 0);
  const poolBy = {};
  (DB.partners || []).forEach(p => { poolBy[normName(p.businessName)] = p.totalPaid || 0; });
  const consumed = {};
  rows.forEach(r => {
    const pool = poolBy[r.key] || 0;
    const prior = consumed[r.key] || 0;
    const paid = Math.max(0, Math.min(r.amount, pool - prior));
    consumed[r.key] = prior + r.amount;
    r.amountPaid = paid;
    r.balance = r.amount - paid;
    r.status = r.balance <= 0.5 ? 'Paid' : paid > 0 ? 'Part Paid' : 'UnPaid';
  });
  return rows;
}

function fuelLedgerFor(truckId){
  const rows = (DB.fuel || []).filter(f=>f.truckId===truckId).slice().sort(byDateThenId);
  let bal = 0;
  return rows.map(r=>{
    bal += (Number(r.litresIn)||0) - (Number(r.litresOut)||0);
    return {...r, balance: bal};
  });
}
function fuelBalance(truckId){
  const l = fuelLedgerFor(truckId);
  return l.length ? l[l.length-1].balance : (DB.dieselInventory?.[truckId] || 0);
}

const JOB_ADDITIONAL_COST_FIELDS = ['fuelCost','materialCost','loadingCost','revenueCost','coExpenses','driverWages'];

  return 'JOB-' + String(n).padStart(3,'0');

  return (DB.jobs || []).find(j => j.id === id);

function jobChildInvoices(jobId){
  return (DB.operations || []).filter(o => o.parentJobId === jobId);
}
function computeJobTotals(job){
  if (job.jobType === 'TH-DAY') {
    const kids = jobChildInvoices(job.id);
    const revenue = kids.reduce((s,o) => s + calculateRevenue(o), 0);
    const cost = kids.reduce((s,o) => s + calculateCosts(o), 0);
    return { revenue, cost, profit: revenue - cost, count: kids.length };
  }
  // PARTNER
  const revenue = Number(job.contractSum) || 0;
  const payoutTotal = (job.collaboratorPayouts || []).reduce((s,p) => s + (Number(p.amount)||0), 0);
  const additionalTotal = JOB_ADDITIONAL_COST_FIELDS.reduce((s,f) => s + (Number(job.additionalCosts?.[f])||0), 0);
  const cost = payoutTotal + additionalTotal;
  return { revenue, cost, profit: revenue - cost, count: (job.collaboratorPayouts||[]).length, payoutTotal, additionalTotal };
}

// Keeps a single shadow operations record in sync with a PARTNER job so the
// contract revenue and collaborator payouts flow into the Sales Ledger, GL,
// Dashboard and the customer's wallet exactly like any other invoice.
function syncPartnerJobOperation(job){
  const totals = computeJobTotals(job);
  let op = (DB.operations || []).find(o => o.parentJobId === job.id);
  if (!op) {
    op = {
      id: 'op_job_' + job.id,
      jobId: nextJobId(),
      invoiceNumber: nextInvoiceNumber(),
      parentJobId: job.id,
      invoiceType: 'PARTNER',
      date: job.date, customer: job.customer, orderStatus: 'EXECUTED',
      location: '', vehicleId: '', dueDate: null, terms: '', notes: job.notes || '',
      qty: 0, unitPrice: 0, transportFee: 0, rentalCharges: 0, commissionAmount: 0,
      ltrPurchased: 0, pricePerLitre: 0, ltrUsed: 0, supplier: '',
      partnerName: (job.collaboratorPayouts||[]).map(p=>p.partnerName).join(', '),
      assetProv: 0, truckMaint: 0, hiringCost: 0,
    };
    DB.operations.push(op);
  }
  op.date = job.date;
  op.customer = job.customer;
  op.notes = job.notes || '';
  op.jobRevenue = totals.revenue;
  op.partnerCost = totals.payoutTotal;
  op.partnerName = (job.collaboratorPayouts||[]).map(p=>p.partnerName).join(', ');
  JOB_ADDITIONAL_COST_FIELDS.forEach(f => { op[f] = Number(job.additionalCosts?.[f]) || 0; });
  if (job.customer) upsertCustomerName(job.customer);
  return op;
}

  const ops = (DB.operations || []).filter(o=>o.vehicleId===truck && o.orderStatus==='EXECUTED');
  const revenue = ops.reduce((s,o)=>s+opRevenue(o),0);

  return { revenue, cost, profit: revenue-cost, trips: ops.length };
}

function syncFuelForOperation(op){
  // Fuel only syncs for jobs run on OUR OWN trucks — external hire models use
  // someone else's truck, so they never touch our fuel log.
  if (!['DS','TR-TRIP','TR-DAY'].includes(op.invoiceType)) return;
  DB.fuel = (DB.fuel || []).filter(f => f.linkedJobId !== op.jobId);
  const litres = Number(op.ltrUsed) || 0;
  const purchased = Number(op.ltrPurchased) || 0;
  if (purchased > 0 && op.vehicleId && op.vehicleId !== 'EXT-01') {
    DB.fuel.push({
      id: 'fuel_pur_' + Date.now(),
      date: op.date,
      truckId: op.vehicleId,
      transaction: 'Fuelling',
      ref: op.jobId,
      litresIn: purchased,
      litresOut: 0,
      pricePerLitre: Number(op.pricePerLitre) || 0,
      totalCost: purchased * (Number(op.pricePerLitre) || 0),
      linkedJobId: op.jobId,
    });
  }
  if (litres > 0 && op.vehicleId && op.vehicleId !== 'EXT-01') {
    DB.fuel.push({
      id: 'fuel_use_' + Date.now(),
      date: op.date,
      truckId: op.vehicleId,
      transaction: 'Trip Allocation',
      ref: op.jobId,
      litresIn: 0,
      litresOut: litres,
      linkedJobId: op.jobId,
    });
  }
  if (op.vehicleId && op.vehicleId !== 'EXT-01') {
    const current = DB.dieselInventory?.[op.vehicleId] || 0;
    DB.dieselInventory[op.vehicleId] = current + purchased - litres;
  }
}

function walletHintFor(name){
  name = (name||'').trim();
  if(!name) return '';
  const key = normName(name);
  const known = getCustomerByName(name) || (DB.operations || []).some(o=>normName(o.customer)===key) || (DB.payments || []).some(p=>normName(p.customer)===key);
  if(!known) return '<span style="color:var(--text-faint);">New customer — no history yet.</span>';
  const w = computeCustomerWallets().find(r=>r.key===key);
  if(!w || (w.deposits===0 && w.delivered===0)) return '<span style="color:var(--text-faint);">No transactions yet.</span>';
  if(w.balance >= 0){
    return `<span style="color:var(--good); font-weight:600;">Wallet credit: +${fmtMoney(w.balance)}</span> <span style="color:var(--text-faint);">— will auto-apply to this invoice</span>`;
  }
  return `<span style="color:var(--bad); font-weight:600;">Currently owes: ${fmtMoney(-w.balance)}</span>`;
}

function openModal(html, onMount){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-overlay active" id="modalOverlay"><div class="modal">${html}</div></div>`;
  document.getElementById('modalOverlay').addEventListener('mousedown', (e)=>{
    if(e.target.id === 'modalOverlay') closeModal();
  });
  if(onMount) setTimeout(onMount, 10);
}

function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
}

let activeMenuCloser = null;
function openActionMenu(triggerEl, items){
  if(activeMenuCloser){ activeMenuCloser(); activeMenuCloser = null; return; }
  const rect = triggerEl.getBoundingClientRect();
  const menu = document.createElement('div');
  menu.className = 'dropdown-menu';
  menu.style.position = 'fixed';
  menu.style.top = (rect.bottom + 6) + 'px';
  menu.style.left = Math.min(rect.left, window.innerWidth - 220) + 'px';
  menu.innerHTML = items.map((it,i)=>{
    if(it===null) return '<div class="dropdown-sep"></div>';
    return `<div class="dropdown-item ${it.danger?'danger':''} ${it.disabled?'disabled':''}" data-idx="${i}">${it.icon||''}<span>${esc(it.label)}</span></div>`;
  }).join('');
  document.body.appendChild(menu);
  menu.querySelectorAll('.dropdown-item').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const item = items[+el.dataset.idx];
      if(item && !item.disabled){ close(); item.onClick(); }
    });
  });
  function close(){
    menu.remove();
    document.removeEventListener('mousedown', onOutside, true);
    document.removeEventListener('keydown', onEsc, true);
    activeMenuCloser = null;
  }
  function onOutside(e){ if(!menu.contains(e.target)) close(); }
  function onEsc(e){ if(e.key==='Escape') close(); }
  setTimeout(()=>{
    document.addEventListener('mousedown', onOutside, true);
    document.addEventListener('keydown', onEsc, true);
  }, 0);
  activeMenuCloser = close;
}

  `, ()=>{

}

class SimpleChart {
  constructor(canvasId, config) {
    this.canvas = document.getElementById(canvasId);
    if (!this.canvas) return;
    this.ctx = this.canvas.getContext('2d');
    this.config = config;
    setTimeout(() => this.draw(), 50);
  }

  draw() {
    const ctx = this.ctx;
    const canvas = this.canvas;
    if (!canvas || !canvas.isConnected) return;
    const W = canvas.width || canvas.parentElement.clientWidth || 300;
    const H = canvas.height || canvas.parentElement.clientHeight || 200;
    canvas.width = W;
    canvas.height = H;

    const data = this.config.data;
    const labels = data.labels || [];
    const datasets = data.datasets || [];
    const padding = { top: 20, bottom: 30, left: 50, right: 20 };
    const chartW = W - padding.left - padding.right;
    const chartH = H - padding.top - padding.bottom;

    ctx.clearRect(0, 0, W, H);

    let maxVal = 0;
    datasets.forEach(ds => {
      (ds.data || []).forEach(v => { if (v > maxVal) maxVal = v; });
    });
    if (maxVal === 0) maxVal = 1;

    ctx.strokeStyle = '#E4DFD1';
    ctx.lineWidth = 0.5;
    for (let i = 0; i <= 4; i++) {
      const y = padding.top + (chartH / 4) * i;
      ctx.beginPath();
      ctx.moveTo(padding.left, y);
      ctx.lineTo(W - padding.right, y);
      ctx.stroke();
      ctx.fillStyle = '#8B8577';
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText('₦' + Math.round(maxVal * (1 - i/4) / 1000) + 'k', padding.left - 6, y + 3);
    }

    const colors = ['#35597A', '#B5502E', '#3F7D58', '#B8860B', '#7A5C8E'];
    datasets.forEach((ds, di) => {
      const color = ds.backgroundColor || colors[di % colors.length];
      const dataPoints = ds.data || [];

      if (ds.type === 'doughnut' || ds.type === 'pie') {
        const centerX = W / 2;
        const centerY = H / 2;
        const radius = Math.min(W, H) / 2 - 30;
        const total = dataPoints.reduce((a,b) => a + b, 0);
        if (total === 0) {
          ctx.fillStyle = '#8B8577';
          ctx.font = '12px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('No data', centerX, centerY);
          return;
        }
        let startAngle = -Math.PI / 2;
        const colors2 = ['#B5502E','#35597A','#3F7D58','#B8860B','#7A5C8E','#4C6B8A','#8F3E22'];
        const innerRadius = ds.type === 'doughnut' ? radius * 0.6 : 0;
        dataPoints.forEach((v, i) => {
          const sliceAngle = (v / total) * 2 * Math.PI;
          ctx.beginPath();
          ctx.arc(centerX, centerY, radius, startAngle, startAngle + sliceAngle);
          ctx.arc(centerX, centerY, innerRadius, startAngle + sliceAngle, startAngle, true);
          ctx.closePath();
          ctx.fillStyle = colors2[i % colors2.length];
          ctx.fill();
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 2;
          ctx.stroke();
          startAngle += sliceAngle;
        });
        return;
      }

      if (ds.type === 'line' || ds.fill) {
        const points = dataPoints.map((v, i) => ({
          x: padding.left + (i / Math.max(labels.length - 1, 1)) * chartW,
          y: padding.top + chartH - (v / maxVal) * chartH
        }));
        if (ds.fill) {
          ctx.beginPath();
          ctx.moveTo(points[0].x, padding.top + chartH);
          points.forEach(p => ctx.lineTo(p.x, p.y));
          ctx.lineTo(points[points.length-1].x, padding.top + chartH);
          ctx.closePath();
          ctx.fillStyle = color + '30';
          ctx.fill();
        }
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) {
          ctx.lineTo(points[i].x, points[i].y);
        }
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.stroke();
        points.forEach((p) => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
          ctx.fillStyle = color;
          ctx.fill();
        });
      } else {
        const barWidth = Math.min(chartW / labels.length * 0.6, 40);
        const groupWidth = chartW / labels.length;
        const offset = (groupWidth - barWidth) / 2;
        dataPoints.forEach((v, i) => {
          const x = padding.left + i * groupWidth + offset;
          const barH = (v / maxVal) * chartH;
          const y = padding.top + chartH - barH;
          ctx.fillStyle = color;
          ctx.fillRect(x, y, barWidth, barH);
        });
      }

      labels.forEach((label, i) => {
        ctx.fillStyle = '#5B564C';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'center';
        const x = ds.type === 'line' ? padding.left + (i / Math.max(labels.length - 1, 1)) * chartW : padding.left + i * (chartW / labels.length) + (chartW / labels.length) / 2;
        ctx.fillText(label, x, padding.top + chartH + 16);
      });
    });
  }

  destroy() {
    this.canvas = null;
    this.ctx = null;
  }
}

function renderDashboard(){
  const el = document.getElementById('view-dashboard');
  const ops = DB.operations || [];
  const executed = ops.filter(o=>o.orderStatus==='EXECUTED');
  const filtered = dashTruckFilter==='All Trucks' ? executed : executed.filter(o=>o.vehicleId===dashTruckFilter);

  const revenue = filtered.reduce((s,o)=>s+opRevenue(o),0);
  const cost = filtered.reduce((s,o)=>s+calculateCosts(o),0);
  const profit = revenue - cost;
  const margin = revenue ? (profit/revenue) : 0;
  const trips = filtered.length;
  const wallets = computeCustomerWallets();
  const outstanding = wallets.reduce((s,w)=> s + (w.balance<0 ? w.balance : 0), 0);
  const totalCredit = wallets.reduce((s,w)=> s + (w.balance>0 ? w.balance : 0), 0);
  const tankA = fuelBalance('Truck A');
  const tankB = fuelBalance('Truck B');
  const cashBank = (DB.payments || []).reduce((s,p)=>s+(Number(p.amount)||0),0) - executed.reduce((s,o)=>s+calculateCosts(o),0);

  // Accounts payable = what we still owe collaborators + partners (creditors).
  const apTotal = (DB.suppliers || []).reduce((s,x)=> s + Math.max(0, x.balance || 0), 0)
                + (DB.partners || []).reduce((s,x)=> s + Math.max(0, x.balance || 0), 0);
  const creditorCount = (DB.suppliers || []).filter(x=>(x.balance||0) > 0.5).length
                      + (DB.partners || []).filter(x=>(x.balance||0) > 0.5).length;

  const revenueByModel = {};
  BUSINESS_MODELS.forEach(m => { revenueByModel[m.id] = executed.filter(o=>o.invoiceType===m.id).reduce((s,o)=>s+opRevenue(o),0); });

  const today = todayISO();
  const todayExecuted = executed.filter(o=>o.date === today);
  const todayRevenue = todayExecuted.reduce((s,o)=>s+opRevenue(o),0);
  const todayCost = todayExecuted.reduce((s,o)=>s+calculateCosts(o),0);
  const todayProfit = todayRevenue - todayCost;

  const vehicleOptions = ['All Trucks', ...(DB.vehicles || [])];

  el.innerHTML = `

      <label style="font-size:12.5px; font-weight:600; color:var(--text-soft);">Filter by vehicle</label>

      <div class="card kpi ${todayProfit>=0?'good':'bad'}"><div class="kpi-label">Today's Profit</div><div class="kpi-value">${fmtMoney(todayProfit)}</div><div class="kpi-sub">${todayRevenue ? ((todayProfit/todayRevenue)*100).toFixed(1)+'% margin' : 'No sales'}</div></div>
      <div class="card kpi bad"><div class="kpi-label">Outstanding Balances</div><div class="kpi-value">${fmtMoney(Math.abs(outstanding))}</div><div class="kpi-sub">${wallets.filter(w=>w.balance<0).length} customers owe</div></div>

    </div>

    <div class="grid grid-4">
      <div class="card kpi"><div class="kpi-label">Total Revenue</div><div class="kpi-value">${fmtMoney(revenue)}</div><div class="kpi-sub">${trips} trips counted</div></div>
      <div class="card kpi bad"><div class="kpi-label">Total Cost</div><div class="kpi-value">${fmtMoney(cost)}</div><div class="kpi-sub">fuel, materials, wages &amp; overheads</div></div>
      <div class="card kpi good"><div class="kpi-label">Net Profit</div><div class="kpi-value">${fmtMoney(profit)}</div><div class="kpi-sub">revenue minus total cost</div></div>

      meta:`${model ? model.label : o.invoiceType} · ${o.material || 'N/A'}`,
      amt:opRevenue(o),
      color: o.orderStatus==='EXECUTED'?'var(--good)':o.orderStatus==='CANCELLED'?'var(--bad)':'var(--amber)'
    });
  });
  (DB.payments || []).slice().sort(byDateThenId).slice(-5).reverse().forEach(p=>{
    items.push({ date:p.date, label:`Payment · ${titleCase(p.customer)}`, meta: p.jobId ? `Tagged to ${p.jobId}` : 'Wallet top-up', amt:p.amount, color:'var(--steel)', isPay:true });
  });
  items.sort((a,b)=> a.date < b.date ? 1 : -1);
  if(!items.length){
    feed.innerHTML = `<div class="empty-state"><p>No activity yet — start by creating a job or logging a payment.</p></div>`;
    return;
  }
  feed.innerHTML = items.slice(0,8).map(it=>`
    <div class="activity-item">
      <span class="activity-dot" style="background:${it.color}"></span>
      <div>
        <div><b>${esc(it.label)}</b></div>
        <div class="meta">${esc(it.meta)} · ${fmtDate(it.date)}</div>
      </div>
      <div class="activity-amt" style="color:${it.isPay?'var(--good)':'var(--text)'}">${it.isPay?'+':''}${fmtMoney(it.amt)}</div>
    </div>
  `).join('');
}

function renderDashboardCharts(){
  dashCharts.forEach(c => c.destroy());
  dashCharts = [];

  const executed = DB.operations.filter(o=>o.orderStatus==='EXECUTED');

  const modelRevenue = {};
  BUSINESS_MODELS.forEach(m => {
    const rev = executed.filter(o=>o.invoiceType===m.id).reduce((s,o)=>s+opRevenue(o),0);
    if (rev > 0) modelRevenue[m.label] = rev;
  });
  const modelLabels = Object.keys(modelRevenue);
  const modelValues = Object.values(modelRevenue);
  const modelColors = ['#35597A','#B5502E','#3F7D58','#B8860B','#7A5C8E','#4C6B8A','#8F3E22'];

  if (modelLabels.length) {
    dashCharts.push(new SimpleChart('chartModels', {
      data: { labels: modelLabels, datasets: [{ data: modelValues, type: 'doughnut', backgroundColor: modelColors.slice(0, modelLabels.length) }]},
      options: { type: 'doughnut' }
    }));
  }

  const trucks = (DB.vehicles || []).filter(v=>v!=='EXT-01');
  const rev = trucks.map(t=> executed.filter(o=>o.vehicleId===t).reduce((s,o)=>s+opRevenue(o),0));
  const cst = trucks.map(t=> executed.filter(o=>o.vehicleId===t).reduce((s,o)=>s+calculateCosts(o),0));
  const prf = trucks.map((t,i)=> rev[i]-cst[i]);

  if (trucks.length && rev.some(v=>v>0)) {
    dashCharts.push(new SimpleChart('chartTrucks', {
      data: { labels: trucks, datasets: [
        { label: 'Revenue', data: rev, backgroundColor: '#35597A' },
        { label: 'Cost', data: cst, backgroundColor: '#B5502E' },
        { label: 'Profit', data: prf, backgroundColor: '#3F7D58' },
      ]}
    }));
  }

  const monthMap = {};
  executed.forEach(o=>{
    const m = (o.date||'').slice(0,7);
    if(!m) return;
    monthMap[m] = monthMap[m] || {rev:0, cost:0};
    monthMap[m].rev += opRevenue(o);
    monthMap[m].cost += calculateCosts(o);
  });
  const months = Object.keys(monthMap).sort();
  const trendRev = months.map(m=>monthMap[m].rev);
  const trendCost = months.map(m=>monthMap[m].cost);
  const trendLabels = months.map(m=>{
    const [y,mo] = m.split('-');
    return new Date(Number(y), Number(mo)-1, 1).toLocaleDateString('en-GB',{month:'short', year:'2-digit'});
  });

  if (trendLabels.length) {
    dashCharts.push(new SimpleChart('chartTrend', {
      data: { labels: trendLabels, datasets: [
        { label: 'Revenue', data: trendRev, backgroundColor: '#35597A', type: 'line', fill: true },
        { label: 'Cost', data: trendCost, backgroundColor: '#B5502E', type: 'line', fill: true },
      ]},
      options: { type: 'line' }
    }));
  }
}

      const grid = document.getElementById('costFieldsGrid');

      let hasHidden = false;

      COST_TIER_FIELDS.forEach(f => {
        const wrap = document.getElementById('fieldwrap_' + f);
        if (!wrap) return;
        if (f === 'fuelCost' && isFuelModel) { wrap.style.display = 'none'; return; }
        if (fields.always.includes(f)) {
          wrap.style.display = '';
        } else if (fields.hidden.includes(f)) {
          hasHidden = true;
          wrap.style.display = open ? '' : 'none';
        } else {
          wrap.style.display = 'none';
        }
      });

      const toggleBtn = document.getElementById('costHiddenToggleBtn');
      if (toggleBtn) toggleBtn.style.display = hasHidden ? 'inline-flex' : 'none';
    }

    window.toggleInvoiceFields = function() {
      const modelEl = document.getElementById('f_invoiceType');
      if (!modelEl) return;
      const model = modelEl.value;
      const isTHTripBatch = model === 'TH-TRIP' && !editing;
      const isMaterial = (model === 'DS' || model === 'TH-TRIP') && !isTHTripBatch;
      const isPartner = model === 'PARTNER';
      const isContract = model === 'CONTRACT';
      const isHireDay = model === 'TH-DAY';
      const isHire = ['TH-TRIP','TH-DAY'].includes(model);
      const isRental = ['TR-TRIP','TR-DAY'].includes(model);
      const isFuelModel = ['DS','TR-TRIP','TR-DAY'].includes(model);

      document.getElementById('revenueMaterial').style.display = isMaterial ? '' : 'none';
      document.getElementById('revenueHire').style.display = isHireDay ? '' : 'none';
      document.getElementById('revenueRental').style.display = isRental ? '' : 'none';
      document.getElementById('revenueCommission').style.display = isContract ? '' : 'none';
      document.getElementById('revenuePartner').style.display = isPartner ? '' : 'none';
      document.getElementById('supplierSection').style.display = isHire ? '' : 'none';
      const hiringCostWrap = document.getElementById('hiringCostFieldWrap');
      if (hiringCostWrap) hiringCostWrap.style.display = (model === 'TH-TRIP') ? '' : 'none';
      document.getElementById('partnerSection').style.display = isPartner ? '' : 'none';
      document.getElementById('fuelFields').style.display = isFuelModel ? '' : 'none';

      const custWrap = document.getElementById('customerFieldWrap');
      const truckNoRow = document.getElementById('truckNoRow');
      const locStatusRow = document.getElementById('locStatusRow');
      const dueDateWrap = document.getElementById('dueDateFieldWrap');
      const jobIdWrap = document.getElementById('jobIdFieldWrap');
      const costsHeading = document.getElementById('costsSectionHeading');
      const costsGridEl = document.getElementById('costFieldsGrid');
      const costsToggleWrap = document.getElementById('costToggleWrap');

      if (custWrap) custWrap.style.display = isTHTripBatch ? 'none' : '';
      if (truckNoRow) truckNoRow.style.display = ['TH-TRIP','TH-DAY'].includes(model) ? '' : 'none';
      if (dueDateWrap) dueDateWrap.style.display = (model === 'TH-TRIP') ? 'none' : '';
      if (isTHTripBatch) {
        if (locStatusRow) locStatusRow.style.display = 'none';
        if (jobIdWrap) jobIdWrap.style.display = 'none';
        if (costsHeading) costsHeading.style.display = 'none';
        if (costsGridEl) costsGridEl.style.display = 'none';
        if (costsToggleWrap) costsToggleWrap.style.display = 'none';
      } else {
        if (locStatusRow) locStatusRow.style.display = '';
        if (jobIdWrap) jobIdWrap.style.display = '';
        if (costsHeading) costsHeading.style.display = '';
        if (costsGridEl) costsGridEl.style.display = '';
        if (costsToggleWrap) costsToggleWrap.style.display = (model === 'TH-TRIP') ? 'none' : '';
      }

      const dayJobSection = document.getElementById('dayJobSection');
      if (dayJobSection) dayJobSection.style.display = (model === 'TH-DAY' && !editing) ? '' : 'none';
      const tripHireSection = document.getElementById('tripHireSection');
      if (tripHireSection) tripHireSection.style.display = isTHTripBatch ? '' : 'none';

      const grid = document.getElementById('costFieldsGrid');
      if (grid) grid.dataset.open = '0';
      const toggleBtn = document.getElementById('costHiddenToggleBtn');
      if (toggleBtn) toggleBtn.textContent = '[+] Show Additional Costs';

      if (!editing) {
        (getModelFields(model).hidden || []).forEach(f => {
          const el = document.getElementById('f_' + f);
          if (el) el.value = '0';
        });
      }

      applyFieldTiers(model);
      updateSummary();
    };

    window.updateCustomerSummary = function(customerName) {
      const container = document.getElementById('customerSummaryContainer');
      const hint = document.getElementById('opWalletHint');
      if (!customerName) {
        if (container) container.innerHTML = '';
        if (hint) hint.innerHTML = '';
        return;
      }
      const summary = getCustomerSummary(customerName);
      if (summary && container) {
        container.innerHTML = `
          <div style="background:var(--steel-light); border-radius:8px; padding:10px 14px; margin-bottom:14px; font-size:12px;">
            <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px;">
              <span><b>Balance:</b> <span class="wallet-chip ${summary.balance>=0?'pos':'neg'}">${summary.balance>=0?'+':''}${fmtMoney(summary.balance)}</span></span>
              <span><b>Total Supplied:</b> ${fmtMoney(summary.totalSupplied)}</span>
              <span><b>Total Paid:</b> ${fmtMoney(summary.totalPaid)}</span>
              <span><b>Last Transaction:</b> ${summary.lastTransaction?fmtDate(summary.lastTransaction):'—'}</span>
            </div>
          </div>
        `;
        if (hint) hint.innerHTML = walletHintFor(customerName);
      }
    };

    window.updateSupplierBalance = function(supplierName) {
      const hint = document.getElementById('supplierBalanceHint');
      if (supplierName && hint) {
        const supplier = getSupplierByName(supplierName);
        hint.textContent = 'Balance: ' + fmtMoney(supplier ? supplier.balance : 0);
      }
    };
    window.addTrip = function() {
      const container = document.getElementById('tripsContainer');
      const idx = container.children.length;
      const tripHTML = `
        <div class="trip-entry">
          <div class="trip-header">
            <h5>Trip #${idx+1}</h5>
            <button class="btn btn-danger btn-sm" onclick="window.removeTrip(${idx})">${ICONS.close}</button>
          </div>
          <div class="field-row">
            <div class="field"><label>Customer</label><select class="trip-customer">${customerOptions('')}</select></div>
            <div class="field"><label>Material</label><select class="trip-material">${opt(DB.materials || [], '')}</select></div>
          </div>
          <div class="field-row">
            <div class="field"><label>Origin</label><input class="trip-origin" value=""></div>
            <div class="field"><label>Destination</label><input class="trip-destination" value=""></div>
          </div>
          <div class="field-row">
            <div class="field"><label>Transport Fee (₦)</label><input type="number" class="trip-fee" value="0" min="0" step="any"></div>
            <div class="field"><label>Hire Cost (auto)</label><input type="text" class="trip-cost" value="${fmtMoney(0)}" readonly style="background:#EFEBE0;"></div>
          </div>
        </div>
      `;
      container.insertAdjacentHTML('beforeend', tripHTML);
      updateTripCosts();
    };

    window.removeTrip = function(idx) {
      const container = document.getElementById('tripsContainer');
      const children = container.children;
      if (children.length > 1) {
        children[idx].remove();
        Array.from(container.children).forEach((el, i) => {
          const h5 = el.querySelector('h5');
          if (h5) h5.textContent = 'Trip #' + (i+1);
        });
        updateTripCosts();
      } else {
        toast('Cannot remove the last trip', 'err');
      }
    };

    window.addTripHire = function() {
      const container = document.getElementById('tripHireContainer');
      const idx = container.children.length;
      container.insertAdjacentHTML('beforeend', renderTripHireEntry(idx));
      wireTripHireEntry(container.lastElementChild);
      updateTripHireSummary();
    };

    window.removeTripHire = function(idx) {
      const container = document.getElementById('tripHireContainer');
      const children = container.children;
      if (children.length > 1) {
        children[idx].remove();
        Array.from(container.children).forEach((el, i) => {
          const h5 = el.querySelector('h5');
          if (h5) h5.textContent = 'Trip #' + (i+1);
          const removeBtn = el.querySelector('.btn-danger');
          if (removeBtn) removeBtn.setAttribute('onclick', `window.removeTripHire(${i})`);
        });
        updateTripHireSummary();
      } else {
        toast('Cannot remove the last trip', 'err');
      }
    };

    function wireTripHireEntry(entryEl) {
      const qtyEl = entryEl.querySelector('.thtrip-qty');
      const priceEl = entryEl.querySelector('.thtrip-unitPrice');
      const previewEl = entryEl.querySelector('.thtrip-revenue-preview');
      const recalcOne = () => {
        const qty = parseFloat(qtyEl.value) || 0;
        const price = parseFloat(priceEl.value) || 0;
        if (previewEl) previewEl.innerHTML = `Revenue: <b>${fmtMoney(qty * price)}</b>`;
        updateTripHireSummary();
      };
      if (qtyEl) qtyEl.addEventListener('input', recalcOne);
      if (priceEl) priceEl.addEventListener('input', recalcOne);
      entryEl.querySelectorAll('input[class^="thtrip-"], select[class^="thtrip-"]').forEach(el => {
        if (el !== qtyEl && el !== priceEl) el.addEventListener('input', updateTripHireSummary);
      });
    }

    function updateTripHireSummary() {
      const entries = document.querySelectorAll('.thtrip-entry');
      let revenue = 0, costs = 0;
      entries.forEach(el => {
        const qty = parseFloat(el.querySelector('.thtrip-qty')?.value) || 0;
        const price = parseFloat(el.querySelector('.thtrip-unitPrice')?.value) || 0;
        revenue += qty * price;
        TRIP_HIRE_COST_FIELDS.forEach(f => {
          costs += parseFloat(el.querySelector('.thtrip-' + f)?.value) || 0;
        });
      });
      const revEl = document.getElementById('summaryRevenue');
      const costEl = document.getElementById('summaryCost');
      const profEl = document.getElementById('summaryProfit');
      if (revEl) revEl.textContent = fmtMoney(revenue);
      if (costEl) costEl.textContent = fmtMoney(costs);
      if (profEl) {
        const profit = revenue - costs;
        profEl.textContent = fmtMoney(profit);
        profEl.style.color = profit >= 0 ? 'var(--good)' : 'var(--bad)';
      }
    }
    window.updateTripHireSummary = updateTripHireSummary;

    function updateTripCosts() {
      const totalTripsEl = document.getElementById('f_totalTrips');
      if (!totalTripsEl) return;
      const dailyCost = parseFloat(document.getElementById('f_dailyHireCost')?.value) || 0;
      const trips = document.querySelectorAll('.trip-entry');
      const totalTrips = trips.length;
      const costPerTrip = totalTrips > 0 ? dailyCost / totalTrips : 0;

      totalTripsEl.value = String(totalTrips);
      const hintEl = document.getElementById('costPerTripHint');
      if (hintEl) hintEl.innerHTML = `Cost Per Trip: <b>${fmtMoney(costPerTrip)}</b>`;

      trips.forEach(el => {
        const costInput = el.querySelector('.trip-cost');
        if (costInput) costInput.value = fmtMoney(costPerTrip);
      });
      updateSummary();
    }

    function updateSummary() {
      const modelEl = document.getElementById('f_invoiceType');
      if (!modelEl) return;
      const model = modelEl.value;
      const isMaterial = model === 'DS' || model === 'TH-TRIP';
      const isPartner = model === 'PARTNER';
      const isContract = model === 'CONTRACT';
      const isRental = ['TR-TRIP','TR-DAY'].includes(model);
      const isTHDay = model === 'TH-DAY';
      const isFuelModel = ['DS','TR-TRIP','TR-DAY'].includes(model);

      let revenue = 0;
      if (isMaterial) {
        const qty = parseFloat(document.getElementById('f_qty')?.value) || 0;
        const price = parseFloat(document.getElementById('f_unitPrice')?.value) || 0;
        revenue = qty * price;
      } else if (isPartner) {
        revenue = parseFloat(document.getElementById('f_jobRevenue')?.value) || 0;
      } else if (isContract) {
        revenue = parseFloat(document.getElementById('f_commissionAmount')?.value) || 0;
      } else if (isRental) {
        revenue = parseFloat(document.getElementById('f_rentalCharges')?.value) || 0;
      } else if (isTHDay) {
        document.querySelectorAll('.trip-fee').forEach(el => {
          revenue += parseFloat(el.value) || 0;
        });
      }

      let costs = 0;
      const modelFields = getModelFields(model);
      COST_TIER_FIELDS.forEach(f => {
        if (f === 'fuelCost' && isFuelModel) return;
        if (f === 'rentalCharges') return;
        if (modelFields.always.includes(f) || modelFields.hidden.includes(f)) {
          const el = document.getElementById('f_' + f);
          if (el) costs += parseFloat(el.value) || 0;
        }
      });

      if (isPartner) {
        costs += parseFloat(document.getElementById('f_partnerCost')?.value) || 0;
      }

      // TH-TRIP: hiringCost is in the supplier section, not the cost grid
      if (model === 'TH-TRIP') {
        costs += parseFloat(document.getElementById('f_hiringCost')?.value) || 0;
      }

      if (isFuelModel) {
        const ltr = parseFloat(document.getElementById('f_ltrUsed')?.value) || 0;
        const price = parseFloat(document.getElementById('f_pricePerLitre')?.value) || 0;
        const fuelEl = document.getElementById('f_fuelCost');
        const fuelDisplayEl = document.getElementById('f_fuelCostDisplay');
        const fuelCost = ltr * price;
        if (fuelEl) fuelEl.value = String(fuelCost);
        if (fuelDisplayEl) fuelDisplayEl.value = String(fuelCost);
        costs += fuelCost;
      }

      const profit = revenue - costs;
      document.getElementById('summaryRevenue').textContent = fmtMoney(revenue);
      document.getElementById('summaryCost').textContent = fmtMoney(costs);
      const profitEl = document.getElementById('summaryProfit');
      profitEl.textContent = fmtMoney(profit);
      profitEl.style.color = profit >= 0 ? 'var(--good)' : 'var(--bad)';

      if (isPartner) {
        const partnerCost = parseFloat(document.getElementById('f_partnerCost')?.value) || 0;
        const commEl = document.getElementById('partnerCommissionPreview');
        if (commEl) commEl.innerHTML = `Commission: <b>${fmtMoney(revenue - partnerCost)}</b>`;
      }

      if (isMaterial) {
        const revEl = document.getElementById('revenuePreview');
        if (revEl) revEl.innerHTML = `Revenue: <b>${fmtMoney(revenue)}</b>`;
      }
    }

    const inputIds = ['f_qty', 'f_unitPrice', 'f_transportFee', 'f_rentalCharges', 'f_commissionAmount', 'f_jobRevenue', 'f_partnerCost', 'f_ltrUsed', 'f_pricePerLitre', 'f_dailyHireCost']
      .concat(COST_TIER_FIELDS.map(f => 'f_' + f));
    inputIds.forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.addEventListener('input', updateSummary);
        el.addEventListener('change', updateSummary);
      }
    });

    const materialSelect = document.getElementById('f_material');
    if (materialSelect) {
      materialSelect.addEventListener('change', function() {
        const currentModel = document.getElementById('f_invoiceType').value;
        if (currentModel === 'CONTRACT' || currentModel === 'PARTNER') { updateSummary(); return; }
        const material = this.value;
        const defaults = getDefaultCosts(material);
        const fields = ['materialCost','loadingCost','revenueCost','coExpenses','driverWages','assetProv','truckMaint','hiringCost'];
        fields.forEach(f => {
          const el = document.getElementById('f_' + f);
          if (el && defaults[f] !== undefined) {
            el.value = String(defaults[f]);
          }
        });
        updateSummary();
      });
    }

    const ltrUsed = document.getElementById('f_ltrUsed');
    const pricePerLitre = document.getElementById('f_pricePerLitre');
    const fuelCostDisplay = document.getElementById('f_fuelCostDisplay');
    const fuelCostField = document.getElementById('f_fuelCost');
    if (ltrUsed && pricePerLitre && fuelCostField) {
      const syncFuelCost = () => {
        const ltr = parseFloat(ltrUsed.value) || 0;
        const price = parseFloat(pricePerLitre.value) || 0;
        const computed = ltr * price;
        fuelCostField.value = String(computed);
        if (fuelCostDisplay) fuelCostDisplay.value = String(computed);
        updateSummary();
      };
      ltrUsed.addEventListener('input', syncFuelCost);
      pricePerLitre.addEventListener('input', syncFuelCost);
    }

    const dailyHireCost = document.getElementById('f_dailyHireCost');
    if (dailyHireCost) {
      dailyHireCost.addEventListener('input', updateTripCosts);
    }

    document.getElementById('tripsContainer')?.addEventListener('input', function(e) {
      if (e.target.classList.contains('trip-fee')) {
        updateSummary();
      }
    });

    const modelSelect2 = document.getElementById('f_invoiceType');
    if (modelSelect2) {
      modelSelect2.addEventListener('change', function() {
        window.toggleInvoiceFields();
        const model = this.value;
        const isHire = ['TH-TRIP','TH-DAY'].includes(model);
        const vehicleSelect = document.getElementById('f_vehicleId');
        if (vehicleSelect && isHire) {
          vehicleSelect.value = 'EXT-01';
        }
      });
    }

    document.getElementById('saveInvoiceBtn').addEventListener('click', function() {
      const modelForValidation = document.getElementById('f_invoiceType').value;
      const isTHTripBatchSave = modelForValidation === 'TH-TRIP' && !editing;
      const customer = document.getElementById('f_customer').value;
      if (!isTHTripBatchSave && !customer) { toast('Please select a customer', 'err'); return; }

      const model = modelForValidation;
      const isTHDay = model === 'TH-DAY';
      const isNewDayJob = isTHDay && !editing;
      const isNewTripHireJob = isTHTripBatchSave;

      const date = document.getElementById('f_date').value || todayISO();
      const orderStatus = document.getElementById('f_status')?.value || 'EXECUTED';
      const location = document.getElementById('f_location')?.value.trim() || '';
      const vehicleId = document.getElementById('f_vehicleId').value;
      const truckNo = document.getElementById('f_truckNo')?.value.trim() || '';
      const dueDate = document.getElementById('f_dueDate')?.value || null;
      const terms = document.getElementById('f_terms').value.trim();
      const notes = document.getElementById('f_notes').value.trim();
      const supplier = document.getElementById('f_supplier')?.value || '';

      // NEW EXTERNAL-TRIP-HIRE JOB — each trip is a fully independent job.
      if (isNewTripHireJob) {
        const trips = [];
        document.querySelectorAll('.thtrip-entry').forEach(el => {
          const t = {
            customer: el.querySelector('.thtrip-customer')?.value.trim() || '',
            location: el.querySelector('.thtrip-location')?.value.trim() || '',
            status: el.querySelector('.thtrip-status')?.value || 'EXECUTED',
            material: el.querySelector('.thtrip-material')?.value || '',
            qty: parseFloat(el.querySelector('.thtrip-qty')?.value) || 0,
            unitPrice: parseFloat(el.querySelector('.thtrip-unitPrice')?.value) || 0,
          };
          TRIP_HIRE_COST_FIELDS.forEach(f => {
            t[f] = parseFloat(el.querySelector('.thtrip-' + f)?.value) || 0;
          });
          trips.push(t);
        });
        if (!trips.length) { toast('Add at least one trip', 'err'); return; }
        if (trips.some(t => !t.customer)) { toast('Every trip needs a customer', 'err'); return; }

        if (supplier) upsertSupplierName(supplier);

        const hiringCost = parseFloat(document.getElementById('f_hiringCost')?.value) || 0;

        const createdIds = [];
        trips.forEach((t) => {
          upsertCustomerName(t.customer);
          const opId = 'op_' + Date.now() + '_' + createdIds.length;
          const newOp = {
            id: opId,
            date, jobId: nextJobId(), invoiceNumber: nextInvoiceNumber(),
            invoiceType: 'TH-TRIP',
            customer: t.customer,
            material: t.material,
            location: t.location,
            vehicleId, truckNo, orderStatus: t.status, dueDate: null, terms, notes,
            qty: t.qty, unitPrice: t.unitPrice,
            transportFee: 0, rentalCharges: 0, commissionAmount: 0, jobRevenue: 0,
            ltrPurchased: 0, pricePerLitre: 0, ltrUsed: 0,
            supplier,
            fuelCost: t.fuelCost, materialCost: t.materialCost, loadingCost: t.loadingCost,
            revenueCost: t.revenueCost, coExpenses: t.coExpenses, driverWages: t.driverWages,
            assetProv: 0, truckMaint: 0, hiringCost: hiringCost,
            partnerCost: 0, partnerName: '',
          };
          DB.operations.push(newOp);
          createdIds.push(opId);
          syncFuelForOperation(newOp);
        });

        saveDB();
        closeModal();
        toast(`Created ${trips.length} invoice${trips.length > 1 ? 's' : ''} on the hired truck`, 'ok');
        rerenderCurrent();
        return;
      }

      // NEW DAILY-HIRE JOB — daily hire cost apportioned equally across the trips.
      if (isNewDayJob) {
        const trips = [];
        document.querySelectorAll('.trip-entry').forEach(el => {
          trips.push({
            customer: el.querySelector('.trip-customer')?.value || '',
            material: el.querySelector('.trip-material')?.value || '',
            origin: el.querySelector('.trip-origin')?.value || '',
            destination: el.querySelector('.trip-destination')?.value || '',
            transportFee: parseFloat(el.querySelector('.trip-fee')?.value) || 0,
          });
        });
        if (!trips.length) { toast('Add at least one trip', 'err'); return; }

        const n = trips.length;
        const dailyHireCostVal = parseFloat(document.getElementById('f_dailyHireCost')?.value) || 0;
        const dayCostFields = ['fuelCost','materialCost','loadingCost','revenueCost','coExpenses','driverWages','assetProv','truckMaint'];
        const dayCosts = {};
        dayCostFields.forEach(f => { dayCosts[f] = parseFloat(document.getElementById('f_' + f)?.value) || 0; });

        const sharedJobId = nextJobId();
        if (supplier) upsertSupplierName(supplier);

        trips.forEach((t, idx) => {
          const tripCustomer = t.customer || customer;
          upsertCustomerName(tripCustomer);
          const routeNote = (t.origin || t.destination) ? `${t.origin || '—'} → ${t.destination || '—'}` : '';
          DB.operations.push({
            id: 'op_' + Date.now() + '_' + idx,
            date, jobId: sharedJobId, invoiceNumber: nextInvoiceNumber(),
            invoiceType: 'TH-DAY',
            customer: tripCustomer,
            material: t.material,
            location: t.destination || location,
            vehicleId, orderStatus, dueDate, terms,
            notes: [notes, routeNote].filter(Boolean).join(' · '),
            qty: 0, unitPrice: 0,
            transportFee: t.transportFee,
            rentalCharges: 0, commissionAmount: 0,
            ltrPurchased: 0, pricePerLitre: 0, ltrUsed: 0,
            supplier,
            dailyHireCost: dailyHireCostVal, totalTrips: n, trips: [],
            fuelCost: dayCosts.fuelCost / n,
            materialCost: dayCosts.materialCost / n,
            loadingCost: dayCosts.loadingCost / n,
            revenueCost: dayCosts.revenueCost / n,
            coExpenses: dayCosts.coExpenses / n,
            driverWages: dayCosts.driverWages / n,
            assetProv: dayCosts.assetProv / n,
            truckMaint: dayCosts.truckMaint / n,
            hiringCost: dailyHireCostVal / n,
            partnerCost: 0, partnerName: '',
          });
        });

        if (supplier && dailyHireCostVal > 0) {
          const s = getSupplierByName(supplier);
          if (s) updateSupplierBalance(s.id, dailyHireCostVal);
        }

        saveDB();
        closeModal();
        toast(`Created ${n} invoice${n > 1 ? 's' : ''} for ${sharedJobId} — hiring cost apportioned equally`, 'ok');
        rerenderCurrent();
        return;
      }

      // NORMAL SINGLE-INVOICE SAVE
      const updated = {
        ...o,
        jobId: o.jobId || nextJobId(),
        invoiceNumber: o.invoiceNumber || nextInvoiceNumber(),
        date, customer, invoiceType: model, orderStatus, location, vehicleId, truckNo, dueDate, terms, notes,
        material: document.getElementById('f_material')?.value || o.material,
        qty: parseFloat(document.getElementById('f_qty')?.value) || 0,
        unitPrice: parseFloat(document.getElementById('f_unitPrice')?.value) || 0,
        transportFee: parseFloat(document.getElementById('f_transportFee')?.value) || 0,
        rentalCharges: parseFloat(document.getElementById('f_rentalCharges')?.value) || 0,
        commissionAmount: parseFloat(document.getElementById('f_commissionAmount')?.value) || 0,
        jobRevenue: parseFloat(document.getElementById('f_jobRevenue')?.value) || 0,
        ltrPurchased: parseFloat(document.getElementById('f_ltrPurchased')?.value) || 0,
        pricePerLitre: parseFloat(document.getElementById('f_pricePerLitre')?.value) || 0,
        ltrUsed: parseFloat(document.getElementById('f_ltrUsed')?.value) || 0,
        fuelCost: parseFloat(document.getElementById('f_fuelCost')?.value) || 0,
        materialCost: parseFloat(document.getElementById('f_materialCost')?.value) || 0,
        loadingCost: parseFloat(document.getElementById('f_loadingCost')?.value) || 0,
        revenueCost: parseFloat(document.getElementById('f_revenueCost')?.value) || 0,
        coExpenses: parseFloat(document.getElementById('f_coExpenses')?.value) || 0,
        driverWages: parseFloat(document.getElementById('f_driverWages')?.value) || 0,
        assetProv: parseFloat(document.getElementById('f_assetProv')?.value) || 0,
        truckMaint: parseFloat(document.getElementById('f_truckMaint')?.value) || 0,
        hiringCost: parseFloat(document.getElementById('f_hiringCost')?.value) || 0,
        partnerCost: parseFloat(document.getElementById('f_partnerCost')?.value) || 0,
        supplier, partnerName: document.getElementById('f_partner')?.value || '',
        dailyHireCost: o.dailyHireCost || 0,
        totalTrips: o.totalTrips || 0,
        trips: [],
      };

      if (updated.supplier) {
        upsertSupplierName(updated.supplier);
      }

      if (updated.partnerName) {
        upsertPartnerName(updated.partnerName);
      }

      upsertCustomerName(customer);

      if (editing) {
        const idx = DB.operations.findIndex(x=>x.id===id);
        if (idx >= 0) DB.operations[idx] = updated;
      } else {
        DB.operations.push(updated);
      }

      if (updated.partnerName) {
        recomputeAllPartnerTotals();
      }
      if (updated.supplier) {
        recomputeAllSupplierBalances();
      }

      if (['DS','TR-TRIP','TR-DAY'].includes(model)) {
        syncFuelForOperation(updated);
      }

      saveDB();
      closeModal();
      toast(editing ? 'Invoice updated' : 'Invoice created', 'ok');
      rerenderCurrent();
    });

    setTimeout(function() {
      if (!document.getElementById('f_invoiceType')) return;
      window.toggleInvoiceFields();
      const customerSelect = document.getElementById('f_customer');
      if (customerSelect && customerSelect.value) {
        window.updateCustomerSummary(customerSelect.value);
      }
      const supplierSelect = document.getElementById('f_supplier');
      if (supplierSelect && supplierSelect.value) {
        window.updateSupplierBalance(supplierSelect.value);
      }
      updateTripCosts();
      updateSummary();
      document.querySelectorAll('.thtrip-entry').forEach(function(el){ wireTripHireEntry(el); });
      updateTripHireSummary();
    }, 50);
  });
}

function openInvoiceMenu(btn, opId){
  const o = (DB.operations||[]).find(x=>x.id===opId);
  if(!o) return;
  const salesRow = computeSalesLedger().find(r=>r.id===o.id);
  const balance = salesRow ? salesRow.balance : calculateRevenue(o);
  window.openActionMenu(btn, [
    { label:'View / print invoice', icon:ICONS.invoice, onClick:()=>window.openInvoiceViewer(o.id) },
    { label:'Edit invoice', icon:ICONS.edit, onClick:()=>window.openInvoiceForm(o.id) },
    { label: balance>0 ? 'Record payment' : 'Fully paid', icon:ICONS.pay, disabled: balance<=0,
      onClick:()=>window.openPaymentForm(null, {customer:o.customer, jobId:o.jobId, amount:balance}) },
    null,
    { label:'Delete invoice', icon:ICONS.trash, danger:true, onClick:()=>window.deleteOperation(o.id) },
  ]);
}

// Splits a TH-DAY job's daily hire cost evenly across all its current invoices,
// stamping the result onto each one's hiringCost field (recomputed from scratch
// every time, so adding/removing a trip never leaves a stale split behind).
function applyDailyHireCostSplit(job){
  const kids = jobChildInvoices(job.id);
  const perTrip = kids.length ? (Number(job.dailyHireCost)||0) / kids.length : 0;
  kids.forEach(op => { op.hiringCost = perTrip; op.truckNo = job.truckNo; op.supplier = job.collaborator; });
  recomputeSupplierBalance(job.collaborator);
}

      ${o.partnerName ? `<div class="field-note" style="margin-bottom:6px;">Partner: ${esc(o.partnerName)}</div>` : ''}
