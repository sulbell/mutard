let arapTab = 'receivables', arapSearch = '';

function renderARAP(){
  const el = document.getElementById('view-arap');

  const wallets = computeCustomerWallets();
  let debtors = wallets.filter(w => w.balance < -0.5).sort((a,b)=> a.balance - b.balance);
  const totalAR = debtors.reduce((s,w)=> s - w.balance, 0);
  const unpaidInvoices = computeSalesLedger().filter(r => r.balance > 0.5).slice().reverse();

  let creditors = [
    ...(DB.suppliers || []).filter(s => (s.balance||0) > 0.5).map(s => ({ kind:'Collaborator', id:s.id, name:s.name, charged:s.totalHiringCost||0, paid:s.totalPaid||0, balance:s.balance||0, phone:s.phone||'' })),
    ...(DB.partners || []).filter(p => (p.balance||0) > 0.5).map(p => ({ kind:'Partner', id:p.id, name:p.businessName, charged:p.totalCharged||0, paid:p.totalPaid||0, balance:p.balance||0, phone:p.phone||'' })),
  ].sort((a,b)=> b.balance - a.balance);
  const totalAP = creditors.reduce((s,c)=> s + c.balance, 0);
  const collabAP = creditors.filter(c=>c.kind==='Collaborator').reduce((s,c)=> s + c.balance, 0);
  const partnerAP = creditors.filter(c=>c.kind==='Partner').reduce((s,c)=> s + c.balance, 0);
  const unpaidPayouts = computePartnerPayoutLedger().filter(r => r.balance > 0.5);

  if (arapSearch) {
    const q = arapSearch.toLowerCase();
    debtors = debtors.filter(d => d.name.toLowerCase().includes(q));
    creditors = creditors.filter(c => c.name.toLowerCase().includes(q));
  }

  el.innerHTML = `
    <div class="note-banner">${ICONS.ledger}<div>Double-entry view of what is owed to you (debtors) and what you owe (creditors). Collaborator amounts charged on hired-truck jobs and partner amounts charged on collaboration jobs sit here as unpaid payables until you record a payment — payments flow into the Bank &amp; Cash Ledger automatically.</div></div>
    <div class="toolbar">
      <div class="tabs" id="arapTabs">
        <button class="tab-btn ${arapTab==='receivables'?'active':''}" data-atab="receivables">Receivables (Debtors) <span style="opacity:.6">(${wallets.filter(w=>w.balance<-0.5).length})</span></button>
        <button class="tab-btn ${arapTab==='payables'?'active':''}" data-atab="payables">Payables (Creditors) <span style="opacity:.6">(${(DB.suppliers||[]).filter(s=>(s.balance||0)>0.5).length + (DB.partners||[]).filter(p=>(p.balance||0)>0.5).length})</span></button>
      </div>
      <div class="spacer"></div>
      <div class="search-box">${ICONS.search}<input id="arapSearchInput" placeholder="Search name…" value="${esc(arapSearch)}"></div>
    </div>
    <div id="arapBody"></div>
  `;

  document.querySelectorAll('#arapTabs .tab-btn').forEach(b=>{
    b.addEventListener('click', ()=>{ arapTab = b.dataset.atab; renderARAP(); });
  });
  document.getElementById('arapSearchInput').addEventListener('input', e=>{ arapSearch = e.target.value; renderARAP(); });

  const body = document.getElementById('arapBody');

  if (arapTab === 'receivables') {
    body.innerHTML = `
      <div class="grid grid-3" style="margin-bottom:20px;">
        <div class="card kpi steel"><div class="kpi-label">Total Receivable</div><div class="kpi-value">${fmtMoney(totalAR)}</div><div class="kpi-sub">owed by customers on executed jobs</div></div>
        <div class="card kpi bad"><div class="kpi-label">Debtors</div><div class="kpi-value">${wallets.filter(w=>w.balance<-0.5).length}</div><div class="kpi-sub">customers with outstanding balances</div></div>
        <div class="card kpi"><div class="kpi-label">Unpaid Invoices</div><div class="kpi-value">${unpaidInvoices.length}</div><div class="kpi-sub">executed jobs with a balance due</div></div>
      </div>
      <div class="section-title"><h3>Debtors</h3><span class="hint">customers who owe us money</span></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Customer</th><th>Phone</th><th class="num-cell">Delivered</th><th class="num-cell">Paid In</th><th class="num-cell">Balance Owed</th><th>Jobs</th><th></th></tr></thead>
          <tbody>
            ${debtors.length ? debtors.map(d=>`
              <tr>
                <td><b>${esc(d.name)}</b></td>
                <td style="color:var(--text-soft);">${d.record && d.record.phone ? esc(d.record.phone) : '—'}</td>
                <td class="num-cell">${fmtMoney(d.delivered)}</td>
                <td class="num-cell" style="color:var(--good)">${fmtMoney(d.deposits)}</td>
                <td class="num-cell"><span class="wallet-chip neg">${fmtMoney(-d.balance)}</span></td>
                <td class="center-cell">${d.jobs}</td>
                <td style="white-space:nowrap;"><button class="btn btn-sm" onclick="window.openPaymentForm(null, {customer:'${esc(d.name).replace(/'/g,"\\'")}', amount:${Math.round(-d.balance)}})">${ICONS.pay} Record payment</button></td>
              </tr>
            `).join('') : `<tr><td colspan="7"><div class="table-empty">No debtors — every customer has settled up.</div></td></tr>`}
          </tbody>
        </table>
      </div>
      <div class="section-title"><h3>Outstanding Invoices</h3><span class="hint">oldest first</span></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Job</th><th>Date</th><th>Customer</th><th>Type</th><th class="num-cell">Due</th><th class="num-cell">Paid</th><th class="num-cell">Balance</th><th>Status</th></tr></thead>
          <tbody>
            ${unpaidInvoices.length ? unpaidInvoices.map(r=>{
              const model = getBusinessModel(r.invoiceType);
              const stampClass = r.status==='Part Paid'?'stamp-part':'stamp-unpaid';
              return `
              <tr class="row-clickable" onclick="window.openInvoiceViewer('${r.id}')">
                <td class="mono">${esc(r.jobId)}</td>
                <td>${fmtDate(r.date)}</td>
                <td>${esc(titleCase(r.customer))}</td>
                <td><span class="model-tag ${modelTagClass(r.invoiceType)}">${esc(model?model.label:r.invoiceType)}</span></td>
                <td class="num-cell">${fmtMoney(r.amountDue)}</td>
                <td class="num-cell" style="color:var(--good)">${fmtMoney(r.amountPaid)}</td>
                <td class="num-cell" style="color:var(--bad)">${fmtMoney(r.balance)}</td>
                <td><span class="stamp ${stampClass}">${r.status}</span></td>
              </tr>`;
            }).join('') : `<tr><td colspan="8"><div class="table-empty">No outstanding invoices.</div></td></tr>`}
          </tbody>
        </table>
      </div>
    `;
  } else {
    body.innerHTML = `
      <div class="grid grid-3" style="margin-bottom:20px;">
        <div class="card kpi accent"><div class="kpi-label">Total Payable</div><div class="kpi-value">${fmtMoney(totalAP)}</div><div class="kpi-sub">owed to collaborators and partners</div></div>
        <div class="card kpi"><div class="kpi-label">Collaborators (Hired Trucks)</div><div class="kpi-value">${fmtMoney(collabAP)}</div><div class="kpi-sub">daily &amp; trip hire not yet paid</div></div>
        <div class="card kpi"><div class="kpi-label">Partners (Collaborations)</div><div class="kpi-value">${fmtMoney(partnerAP)}</div><div class="kpi-sub">payouts charged but not yet paid</div></div>
      </div>
      <div class="section-title"><h3>Creditors</h3><span class="hint">who we owe and how much</span></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Type</th><th>Phone</th><th class="num-cell">Total Charged</th><th class="num-cell">Total Paid</th><th class="num-cell">Balance Owed</th><th></th></tr></thead>
          <tbody>
            ${creditors.length ? creditors.map(c=>`
              <tr>

          </tbody>
        </table>
      </div>
      <div class="section-title"><h3>Unpaid Partner Payouts</h3><span class="hint">payments apply to the oldest payout first</span></div>
      <div class="table-wrap">
        <table>

          <tbody>
            ${unpaidPayouts.length ? unpaidPayouts.map(r=>`

let bankSearch = '';

function renderBank(){
  const el = document.getElementById('view-bank');
  let payments = (DB.payments || []).slice().sort(byDateThenId).reverse();
  if(bankSearch){
    const q = bankSearch.toLowerCase();
    payments = payments.filter(p => [p.jobId,p.reference,p.customer,p.method].join(' ').toLowerCase().includes(q));
  }
  const inflow = payments.reduce((s,p)=> s + Math.max(0, Number(p.amount)||0), 0);
  const outflow = payments.reduce((s,p)=> s + Math.max(0, -(Number(p.amount)||0)), 0);

  el.innerHTML = `
    <div class="note-banner">${ICONS.bank}<div>All cash movements in one place — customer receipts (inflow) and payments to collaborators &amp; partners (outflow), posted double-entry against Accounts Receivable / Accounts Payable.</div></div>
    <div class="toolbar">
      <div class="search-box">${ICONS.search}<input id="bankSearchInput" placeholder="Search reference, customer, method…" value="${esc(bankSearch)}"></div>
      <div class="spacer"></div>
      <span class="badge badge-good" style="font-size:12px;">In ${fmtMoney(inflow)}</span>
      <span class="badge badge-bad" style="font-size:12px;">Out ${fmtMoney(outflow)}</span>
      <span class="badge badge-steel" style="font-size:12px;">Net ${fmtMoney(inflow - outflow)}</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Date</th><th>Reference</th><th>Customer/Supplier</th>
          <th class="num-cell">Inflow</th><th class="num-cell">Outflow</th>
          <th>Method</th><th></th>
        </tr></thead>
        <tbody id="bankTbody"></tbody>
      </table>
    </div>
  `;
  const tbody = document.getElementById('bankTbody');
  if(!payments.length){
    tbody.innerHTML = `<tr><td colspan="7"><div class="table-empty">No transactions match this view.</div></td></tr>`;
  } else {
    tbody.innerHTML = payments.map(p=>{
      const isInflow = Number(p.amount) >= 0;
      return `
        <tr>
          <td>${fmtDate(p.date)}</td>
          <td class="mono">${p.jobId ? esc(p.jobId) : (p.reference || '—')}</td>
          <td>${esc(titleCase(p.customer))}</td>
          <td class="num-cell" style="color:var(--good)">${isInflow ? fmtMoney(p.amount) : ''}</td>
          <td class="num-cell" style="color:var(--bad)">${!isInflow ? fmtMoney(Math.abs(p.amount)) : ''}</td>
          <td>${esc(p.method || 'Cash')}</td>
          <td style="white-space:nowrap;">
            <button class="icon-btn" title="Edit" onclick="window.openPaymentForm('${p.id}')">${ICONS.edit}</button>
            <button class="icon-btn" title="Delete" onclick="window.deletePayment('${p.id}')">${ICONS.trash}</button>
          </td>
        </tr>
      `;
    }).join('');
  }
  document.getElementById('bankSearchInput').addEventListener('input', e=>{ bankSearch = e.target.value; renderBank(); });
}

function openPaymentForm(id, presets){
  const editing = !!id;
  presets = presets || {};
  const p = editing ? DB.payments.find(x=>x.id===id) : {
    id:'pay_'+Date.now(), date: todayISO(), jobId: presets.jobId||'', customer: presets.customer||'',
    amount: presets.amount||0, method:'Cash',
  };

  openModal(`
    <div class="modal-head"><h3>${editing?'Edit payment':'Log payment'}</h3>
      <button class="icon-btn" onclick="window.closeModal()">${ICONS.close}</button>
    </div>
    <div class="modal-body">
      <div class="field"><label>Date</label><input type="date" id="f_pdate" value="${p.date}"></div>
      <div class="field"><label>Customer name <span class="req">*</span></label>
        <input id="f_pcustomer" list="payCustomerListDatalist" value="${esc(titleCase(p.customer||''))}" placeholder="Type or pick a customer" oninput="document.getElementById('payWalletHint').innerHTML = window.walletHintFor(this.value)">
        <datalist id="payCustomerListDatalist">${allCustomerNames().map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
        <div class="field-hint" id="payWalletHint">${walletHintFor(p.customer)}</div>
      </div>
      <div class="field-row">
        <div class="field"><label>Payment method</label><select id="f_pmethod">${opt(['Cash', 'Bank Transfer', 'POS / Card', 'Other'], p.method||'Cash')}</select></div>
        <div class="field"><label>Amount (₦) <span class="req">*</span></label><input type="number" id="f_pamount" value="${p.amount||''}" step="any"></div>
      </div>
      <div class="field"><label>Job-ID <span style="color:var(--text-faint); font-weight:500;">(optional)</span></label>
        <input id="f_pjobid" list="jobIdList" value="${esc(p.jobId||'')}" placeholder="e.g. Job-004">
        <datalist id="jobIdList">${(DB.operations || []).filter(o=>o.orderStatus==='EXECUTED').map(o=>`<option value="${esc(o.jobId)}">`).join('')}</datalist>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="window.closeModal()">Cancel</button>
      <button class="btn btn-primary" id="savePayBtn">${editing?'Save changes':'Log payment'}</button>
    </div>
  `, ()=>{
    document.getElementById('savePayBtn').addEventListener('click', function(){
      const customer = document.getElementById('f_pcustomer').value;
      const amount = parseFloat(document.getElementById('f_pamount').value)||0;
      if(!customer){ toast('Please select a customer', 'err'); return; }
      if(amount===0){ toast('Enter an amount', 'err'); return; }
      const updated = { ...p, date: document.getElementById('f_pdate').value||todayISO(), customer: customer,
        method: document.getElementById('f_pmethod').value,
        jobId: document.getElementById('f_pjobid').value.trim()||null, amount };
      upsertCustomerName(customer);
      if(editing){
        const idx = DB.payments.findIndex(x=>x.id===id);
        if(idx >= 0) DB.payments[idx] = updated;
      } else {
        DB.payments.push(updated);
      }
      saveDB();
      closeModal();
      toast(editing?'Payment updated':'Payment logged', 'ok');
      rerenderCurrent();
    });
  });
}

function deletePayment(id){
  const p = DB.payments.find(x=>x.id===id);
  if(!p) return;
  confirmDialog(`Delete this ${fmtMoney(p.amount)} payment from <b>${esc(titleCase(p.customer))}</b>?`, function(){
    DB.payments = DB.payments.filter(x=>x.id!==id);
    saveDB();
    toast('Payment deleted', 'ok');
    rerenderCurrent();
  });
}

function deleteCustomer(id){

function openCustomerForm(customerId){

      </div>

    <div class="modal-foot">

// Records a payment TO a partner: Cash & Bank credit / Accounts Payable debit.
// The negative payment row also shows as an outflow in the Bank & Cash Ledger.
function recordPartnerPayment(partnerId){
  const p = (DB.partners||[]).find(x=>x.id===partnerId);
  if(!p) return;
  openModal(`
    <div class="modal-head"><h3>Record Payment - ${esc(p.businessName)}</h3><button class="icon-btn" onclick="window.closeModal()">${ICONS.close}</button></div>
    <div class="modal-body">
      <div class="field"><label>Date</label><input type="date" id="f_ppdate" value="${todayISO()}"></div>
      <div class="field"><label>Amount (₦) <span class="req">*</span></label><input type="number" id="f_ppamount" min="0" step="any"></div>
      <div class="field-row">
        <div class="field"><label>Payment Method</label><select id="f_ppmethod">${opt(['Cash', 'Bank Transfer', 'POS / Card', 'Cheque'], 'Bank Transfer')}</select></div>
        <div class="field"><label>Reference</label><input id="f_ppref" placeholder="e.g. REF-001"></div>
      </div>
      <div class="field-hint">Current Balance Owed: <b>${fmtMoney(p.balance||0)}</b> — payment posts double-entry (Dr Accounts Payable / Cr Cash &amp; Bank) and appears in the Bank &amp; Cash Ledger.</div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="window.closeModal()">Cancel</button>
      <button class="btn btn-primary" id="savePpPayBtn">Record Payment</button>
    </div>
  `, ()=>{
    document.getElementById('savePpPayBtn').addEventListener('click', function(){
      const amount = parseFloat(document.getElementById('f_ppamount').value)||0;
      if(amount<=0){ toast('Enter an amount greater than zero', 'err'); return; }
      if(amount > (p.balance||0)){ toast('Amount exceeds balance owed', 'err'); return; }
      DB.payments.push({
        id: 'pay_part_' + Date.now(),
        date: document.getElementById('f_ppdate').value || todayISO(),
        customer: p.businessName + ' (Partner Payment)',
        jobId: null,
        amount: -amount,
        method: document.getElementById('f_ppmethod').value,
        partnerId: p.id,
        reference: document.getElementById('f_ppref').value.trim() || null
      });
      recomputeAllPartnerTotals();
      saveDB();
      closeModal();
      toast('Payment recorded for ' + p.businessName, 'ok');
      rerenderCurrent();
    });
  });
}

// Records a payment TO a collaborator: Cash & Bank credit / Accounts Payable
// debit — the negative payment row shows as an outflow in the Bank & Cash Ledger.
function recordSupplierPayment(supplierId){
  const s = DB.suppliers.find(x=>x.id===supplierId);
  if(!s) return;
  openModal(`
    <div class="modal-head"><h3>Record Payment - ${esc(s.name)}</h3><button class="icon-btn" onclick="window.closeModal()">${ICONS.close}</button></div>
    <div class="modal-body">
      <div class="field"><label>Date</label><input type="date" id="f_spdate" value="${todayISO()}"></div>
      <div class="field"><label>Amount (₦) <span class="req">*</span></label><input type="number" id="f_spamount" min="0" step="any"></div>
      <div class="field-row">
        <div class="field"><label>Payment Method</label><select id="f_spmethod">${opt(['Cash', 'Bank Transfer', 'POS / Card', 'Cheque'], 'Bank Transfer')}</select></div>
        <div class="field"><label>Reference</label><input id="f_spref" placeholder="e.g. REF-001"></div>
      </div>
      <div class="field-hint">Current Balance Owed: <b>${fmtMoney(s.balance||0)}</b> — payment posts double-entry (Dr Accounts Payable / Cr Cash &amp; Bank) and appears in the Bank &amp; Cash Ledger.</div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="window.closeModal()">Cancel</button>
      <button class="btn btn-primary" id="saveSpPayBtn">Record Payment</button>
    </div>
  `, ()=>{
    document.getElementById('saveSpPayBtn').addEventListener('click', function(){
      const amount = parseFloat(document.getElementById('f_spamount').value)||0;
      if(amount<=0){ toast('Enter an amount greater than zero', 'err'); return; }
      if(amount > (s.balance||0)){ toast('Amount exceeds balance owed', 'err'); return; }
      DB.payments.push({
        id: 'pay_supp_' + Date.now(),
        date: document.getElementById('f_spdate').value || todayISO(),
        customer: s.name + ' (Supplier Payment)',
        jobId: null,
        amount: -amount,
        method: document.getElementById('f_spmethod').value,
        supplierId: s.id,
        reference: document.getElementById('f_spref').value.trim() || null
      });
      recomputeSupplierBalance(s.name);
      saveDB();
      closeModal();
      toast('Payment recorded for ' + s.name, 'ok');
      rerenderCurrent();
    });
  });
}

// ============================================================
// 21. FINANCIAL REPORTS — double-entry bookkeeping
// Every executed job posts: Dr Accounts Receivable / Cr Sales Revenue (value),
// Dr Cost of Services / Cr Cash & Bank (costs paid out) and, for amounts owed
// to collaborators & partners, Dr Cost of Services / Cr Accounts Payable.
// Payments in/out of the bank settle AR / AP against Cash & Bank.
// ============================================================
const ACCOUNTS = ['Cash & Bank', 'Accounts Receivable', 'Accounts Payable', 'Sales Revenue', 'Cost of Services'];

function buildJournal(){
  const lines = [];
  (DB.operations || []).filter(o=>o.orderStatus==='EXECUTED').forEach(o=>{
    const due = calculateRevenue(o);
    const cost = calculateCosts(o);
    const model = getBusinessModel(o.invoiceType);
    const label = `${model ? model.label : o.invoiceType} — ${titleCase(o.customer)} — ${o.material || 'N/A'}`;
    if(due > 0){
      lines.push({date:o.date, ref:o.jobId, description:label, account:'Accounts Receivable', debit:due, credit:0});
      lines.push({date:o.date, ref:o.jobId, description:label, account:'Sales Revenue', debit:0, credit:due});
    }
    const isPartnerish = o.invoiceType === 'CONTRACT' || o.invoiceType === 'PARTNER';
    // PORTION OWED TO CREDITORS (hired-truck hiring cost / partner payouts) → AP
    let apPortion = 0, cashCost = 0;
    if(isPartnerish){
      apPortion = Number(o.partnerCost) || 0;
      cashCost = extraHireCosts(o);
    } else if(['TH-TRIP','TH-DAY'].includes(o.invoiceType)){
      apPortion = Number(o.hiringCost) || 0;
      cashCost = Math.max(0, cost - apPortion);
    } else {
      cashCost = cost;
    }
    if(cashCost > 0){
      const clabel = `Operating costs — ${o.material || 'N/A'}${o.vehicleId?' ('+o.vehicleId+')':''}`;
      lines.push({date:o.date, ref:o.jobId, description:clabel, account:'Cost of Services', debit:cashCost, credit:0});
      lines.push({date:o.date, ref:o.jobId, description:clabel, account:'Cash & Bank', debit:0, credit:cashCost});
    }
    if(apPortion > 0){
      const isPartnerPayable = o.invoiceType === 'PARTNER';
      const who = isPartnerPayable ? (o.partnerName || 'N/A') : (o.supplier || 'N/A');
      const alabel = (isPartnerPayable ? 'Partner cost — ' : 'Hiring cost — collaborator ') + titleCase(who);
      lines.push({date:o.date, ref:o.jobId, description:alabel, account:'Cost of Services', debit:apPortion, credit:0});
      lines.push({date:o.date, ref:o.jobId, description:alabel, account:'Accounts Payable', debit:0, credit:apPortion});
    }
  });
  (DB.payments || []).forEach(p=>{
    const amt = Number(p.amount)||0;
    if(amt > 0){
      const label = `Payment received (${p.method||'Cash'}) — ${titleCase(p.customer)}`;
      lines.push({date:p.date, ref:p.jobId||'—', description:label, account:'Cash & Bank', debit:amt, credit:0});
      lines.push({date:p.date, ref:p.jobId||'—', description:label, account:'Accounts Receivable', debit:0, credit:amt});
    } else if(amt < 0){
      let who = titleCase(p.customer);
      if(p.supplierId){ const s = DB.suppliers.find(x=>x.id===p.supplierId); if(s) who = s.name; }
      if(p.partnerId){ const pa = DB.partners.find(x=>x.id===p.partnerId); if(pa) who = pa.businessName; }
      const label = (p.partnerId ? 'Payment to partner — ' : 'Payment to collaborator — ') + who;
      const posAmt = Math.abs(amt);
      lines.push({date:p.date, ref:p.reference||p.jobId||'—', description:label, account:'Accounts Payable', debit:posAmt, credit:0});
      lines.push({date:p.date, ref:p.reference||p.jobId||'—', description:label, account:'Cash & Bank', debit:0, credit:posAmt});
    }
  });
  return lines.sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
}

function buildProfitAndLoss(fromDate, toDate){
  const executed = (DB.operations || []).filter(o => {
    if(o.orderStatus !== 'EXECUTED') return false;
    if(fromDate && o.date < fromDate) return false;
    if(toDate && o.date > toDate) return false;
    return true;
  });

  const revenueByModel = {};
  let totalRevenue = 0;
  BUSINESS_MODELS.forEach(m => {
    const rev = executed.filter(o=>o.invoiceType===m.id).reduce((s,o)=>s+calculateRevenue(o),0);
    revenueByModel[m.id] = rev;
    totalRevenue += rev;
  });

  let fuelCost = 0, driverWages = 0, truckMaint = 0, assetProv = 0, hiringCost = 0;
  let materialCost = 0, loadingCost = 0, revenueCost = 0, coExpenses = 0;

  executed.forEach(o => {
    fuelCost += Number(o.fuelCost) || 0;
    driverWages += Number(o.driverWages) || 0;
    truckMaint += Number(o.truckMaint) || 0;
    assetProv += Number(o.assetProv) || 0;
    hiringCost += Number(o.hiringCost) || 0;
    materialCost += Number(o.materialCost) || 0;
    loadingCost += Number(o.loadingCost) || 0;
    revenueCost += Number(o.revenueCost) || 0;
    coExpenses += Number(o.coExpenses) || 0;
  });

  let partnerCost = 0;
  executed.filter(o=>o.invoiceType==='PARTNER').forEach(o => {
    partnerCost += Number(o.partnerCost) || 0;
  });

  const totalCosts = fuelCost + driverWages + truckMaint + assetProv + hiringCost +
                     materialCost + loadingCost + revenueCost + coExpenses + partnerCost;
  const grossProfit = totalRevenue - totalCosts;

  return {
    period: { from: fromDate, to: toDate },
    revenue: revenueByModel,
    totalRevenue,
    costs: { fuel: fuelCost, driverWages, truckMaint, assetProv, hiringCost, materialCost, loadingCost, revenueCost, coExpenses, partnerCost, total: totalCosts },
    grossProfit,
    margin: totalRevenue ? (grossProfit / totalRevenue * 100) : 0,
  };
}

function renderTrialBalance(body){
  const lines = buildJournal();
  const byAccount = {};
  ACCOUNTS.forEach(a=> byAccount[a] = {debit:0, credit:0});
  lines.forEach(l=>{
    byAccount[l.account] = byAccount[l.account] || {debit:0, credit:0};
    byAccount[l.account].debit += l.debit;
    byAccount[l.account].credit += l.credit;
  });

  const rows = ACCOUNTS.map(a=>{
    const net = byAccount[a].debit - byAccount[a].credit;
    return { account:a, debit: net>=0?net:0, credit: net<0?-net:0 };
  });
  const totalDebit = rows.reduce((s,r)=>s+r.debit,0);
  const totalCredit = rows.reduce((s,r)=>s+r.credit,0);
  const balanced = Math.abs(totalDebit-totalCredit) < 1;

  body.innerHTML = `

          <thead><tr><th>Job</th><th>Customer</th><th>Type</th><th class="num-cell">Due</th><th class="num-cell">Paid</th><th class="num-cell">Balance</th><th>Status</th></tr></thead>

            ${rows.length ? rows.map(r=>{
              const model = getBusinessModel(r.invoiceType);
              const modelLabel = model ? model.label : r.invoiceType;
              return `<tr><td class="mono">${esc(r.jobId)}</td><td>${esc(titleCase(r.customer))}</td>
                <td><span class="model-tag ${modelTagClass(r.invoiceType)}">${esc(modelLabel)}</span></td>
                <td class="num-cell">${fmtMoney(r.amountDue)}</td><td class="num-cell">${fmtMoney(r.amountPaid)}</td>
                <td class="num-cell">${fmtMoney(r.balance)}</td><td>${r.status}</td></tr>`;
            }).join('') : `<tr><td colspan="7"><div class="table-empty">No sales yet.</div></td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function printReport(title){
  const prevTitle = document.title;
  document.title = 'MUTAD — ' + title;
  window.print();
  setTimeout(()=>{ document.title = prevTitle; }, 500);
}

// ============================================================
// 22. GLOBAL SEARCH
// ============================================================
function performGlobalSearch(query){
  if(!query || query.length < 2) return [];
  const q = query.toLowerCase().trim();
  const results = [];

  (DB.customers || []).forEach(c=>{
    const match = c.name.toLowerCase().includes(q) || (c.phone && c.phone.includes(q));
    if(match) results.push({ type:'customer', id:c.id, label:c.name, sub:c.phone || 'Customer', icon:ICONS.cust,
      action:()=>{ custSearch = c.name; switchView('customers'); } });
  });

  (DB.jobs || []).forEach(j=>{
    const match = (j.jobId && j.jobId.toLowerCase().includes(q)) ||
                  (j.collaborator && j.collaborator.toLowerCase().includes(q)) ||
                  (j.customer && j.customer.toLowerCase().includes(q));
    if(match) results.push({ type:'job', id:j.id, label:j.jobId || 'Job',
      sub:`${j.jobType==='TH-DAY'?'External Daily Hire':'Partner Collaboration'} · ${titleCase(j.collaborator||j.customer||'')}`,
      icon:ICONS.jobs, action:()=>{ window.openJobDetail(j.id); } });
  });

  (DB.operations || []).forEach(o=>{
    const match = o.jobId && o.jobId.toLowerCase().includes(q) ||
                  o.customer && o.customer.toLowerCase().includes(q) ||
                  (o.material && o.material.toLowerCase().includes(q));
    if(match) results.push({
      type:'invoice', id:o.id, label:o.jobId || 'Job',
      sub:`${titleCase(o.customer)} · ${o.material || 'N/A'} · ${fmtMoney(calculateRevenue(o))}`,
      icon:ICONS.invoice,
      action:()=>{ window.openInvoiceViewer(o.id); }
    });
  });

  (DB.payments || []).forEach(p=>{
    const match = p.customer && p.customer.toLowerCase().includes(q) || (p.jobId && p.jobId.toLowerCase().includes(q));
    if(match) results.push({
      type:'payment', id:p.id, label:`Payment: ${fmtMoney(p.amount)}`,
      sub:`${titleCase(p.customer)} ${p.jobId?'· '+p.jobId:''}`,
      icon:ICONS.pay, action:()=>{ bankSearch = p.customer || ''; switchView('bank'); }
    });
  });

  (DB.suppliers || []).forEach(s=>{
    if(s.name.toLowerCase().includes(q) || (s.phone && s.phone.includes(q))) {
      results.push({ type:'collaborator', id:s.id, label:s.name, sub:s.phone || 'Collaborator', icon:ICONS.suppliers,
        action:()=>{ window.openSupplierViewer(s.id); } });
    }
  });

  (DB.partners || []).forEach(p=>{
    if(p.businessName.toLowerCase().includes(q)) {
      results.push({ type:'partner', id:p.id, label:p.businessName, sub:p.contactPerson || 'Partner', icon:ICONS.partner,
        action:()=>{ window.openPartnerViewer(p.id); } });
    }
  });

  return results.slice(0, 15);
}

function renderGlobalSearch(query){
  const results = performGlobalSearch(query);
  const container = document.getElementById('globalSearchResults');
  if(!container) return;

  if(!query || query.length < 2 || results.length === 0){
    container.innerHTML = query && query.length >= 2 ?
      `<div style="padding:12px 16px; color:var(--text-faint); font-size:13px;">No results found</div>` :
      `<div style="padding:12px 16px; color:var(--text-faint); font-size:13px;">Type at least 2 characters to search</div>`;
    container.classList.add('active');
    return;
  }

  container.innerHTML = results.map(r=>`
    <div class="gs-item">
      <span class="gs-icon">${r.icon || ICONS.search}</span>
      <div class="gs-main">
        <div class="gs-title">${esc(r.label)}</div>
        <div class="gs-sub">${esc(r.sub)}</div>
      </div>
      <span class="gs-tag">${r.type}</span>
    </div>
  `).join('');

  container.classList.add('active');

  container.querySelectorAll('.gs-item').forEach((el, idx) => {
    el.addEventListener('click', () => {
      const result = results[idx];
      if(result.action) result.action();
      container.classList.remove('active');
      document.getElementById('globalSearchInput').value = '';
    });
  });
}

// ============================================================
// 23. DELETE OPERATION
// ============================================================
function deleteOperation(id){
  const o = DB.operations.find(x=>x.id===id);
  if(!o) return;
  if (o.parentJobId) {
    const job = getJobById(o.parentJobId);
    toast(`This invoice belongs to ${job ? job.jobId : 'a job'} — manage it from the Jobs workspace instead`, 'err');
    return;
  }
  confirmDialog(`Delete <b>${esc(o.jobId)}</b> for <b>${esc(titleCase(o.customer))}</b>?`, function(){
    DB.operations = DB.operations.filter(x=>x.id!==id);
    DB.fuel = (DB.fuel||[]).filter(f => f.linkedJobId !== o.jobId);
    if (o.partnerName) recomputeAllPartnerTotals();
    if (['TH-TRIP','TH-DAY'].includes(o.invoiceType)) recomputeAllSupplierBalances();
    saveDB();
    toast('Deleted', 'ok');
    rerenderCurrent();
  });
}

function initApp(){
  renderShell();
  document.getElementById('pageTitle').textContent = 'Loading…';
  loadDB();

  const searchInput = document.getElementById('globalSearchInput');
  if (searchInput) {
    searchInput.addEventListener('input', function(e) {
      const query = e.target.value;
      if(query.length >= 2) renderGlobalSearch(query);
      else {
        const results = document.getElementById('globalSearchResults');
        if (results) results.classList.remove('active');
      }
    });
    searchInput.addEventListener('blur', function() {
      setTimeout(() => {
        const results = document.getElementById('globalSearchResults');
        if (results) results.classList.remove('active');
      }, 200);
    });
    searchInput.addEventListener('focus', function() {
      if(this.value.length >= 2) renderGlobalSearch(this.value);
    });
    document.addEventListener('keydown', function(e) {
      if(e.key === 'Escape') {
        const results = document.getElementById('globalSearchResults');
        if (results) results.classList.remove('active');
        searchInput.blur();
      }
    });
  }

  switchView('dashboard');
  toast('App ready! ' + DB.customers.length + ' customers loaded.', 'ok');
}

initApp();
